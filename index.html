<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta Segura</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Panel superior de búsqueda */
        .search-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 80px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(18, 18, 18, 0.9);
            border: 2px solid #00f3ff;
            border-radius: 12px;
            padding: 10px 15px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        .input-group input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            width: 100%;
            outline: none;
            padding-right: 30px;
        }
        .input-group input::placeholder {
            color: #aaaaaa;
        }
        .clear-btn {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: #ff5555;
            font-size: 18px;
            cursor: pointer;
        }
        .btn-ir {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            background: #00f3ff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            transition: background 0.2s;
        }
        .btn-ir:hover {
            background: #00bcd4;
        }
        /* Resultados de búsqueda */
        .search-results {
            position: absolute;
            top: 125px;
            left: 15px;
            right: 80px;
            z-index: 20;
            background: rgba(18, 18, 18, 0.95);
            border: 2px solid #00f3ff;
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }
        .search-result-item {
            padding: 12px 15px;
            color: #ffffff;
            border-bottom: 1px solid #333333;
            cursor: pointer;
            font-size: 14px;
        }
        .search-result-item:hover {
            background: rgba(0, 243, 255, 0.2);
        }
        /* Barra lateral derecha de botones flotantes */
        .sidebar-controls {
            position: absolute;
            top: 150px;
            right: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #00f3ff;
            background: rgba(18, 18, 18, 0.9);
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .control-btn:hover {
            transform: scale(1.05);
            background: rgba(0, 243, 255, 0.2);
        }
        .control-btn.alert {
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }
    </style>
</head>
<body>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Panel de búsqueda superior -->
    <div class="search-panel">
        <div class="input-group">
            <input type="text" id="origin-input" value="Mi ubicación actual (GPS vivo)" />
            <button class="clear-btn" onclick="document.getElementById('origin-input').value=''">&times;</button>
        </div>
        <div class="input-group">
            <input type="text" id="search-input" placeholder="Buscar dirección o esquina (ej: Alem y López)..." />
            <button class="clear-btn" onclick="document.getElementById('search-input').value=''; document.getElementById('search-results').innerHTML='';">&times;</button>
        </div>
    </div>

    <button class="btn-ir">IR</button>

    <!-- Contenedor de resultados de búsqueda -->
    <div id="search-results" class="search-results"></div>

    <!-- Barra lateral derecha con botones de control -->
    <div class="sidebar-controls">
        <button class="control-btn" title="Modo Conducción">🚗</button>
        <button class="control-btn" title="Modo Nocturno">🌙</button>
        <button class="control-btn" title="Audio / Voz">🔊</button>
        <button class="control-btn" title="Limpiar Mapa">🗑️</button>
        <button class="control-btn" title="Alertas">📢</button>
        <button class="control-btn alert" title="SOS / Emergencia">⚠️</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar el mapa centrado en Córdoba Capital, Argentina
        const map = L.map('map', { zoomControl: false }).setView([-31.4201, -64.1888], 14);
        window.mapaApp = map;

        // Añadir capa de mapa base limpio
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{z}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        // Lógica de búsqueda adaptada para esquinas y proximidad local
        document.addEventListener("DOMContentLoaded", () => {
            const searchInput = document.getElementById("search-input");
            const resultsContainer = document.getElementById("search-results");

            if (searchInput) {
                searchInput.addEventListener("input", async (e) => {
                    let query = e.target.value.trim();
                    
                    if (query.length < 3) {
                        if (resultsContainer) resultsContainer.innerHTML = "";
                        return;
                    }

                    // 1. Detección y reemplazo para esquinas (ej: "alem y lopez" -> "alem & lopez")
                    query = query.replace(/\s+y\s+/gi, ' & ');

                    // 2. Forzar contexto local en Córdoba si no se especifica
                    if (!query.toLowerCase().includes('córdoba')) {
                        query += ', Córdoba, Argentina';
                    }

                    // 3. Delimitador geográfico (Viewbox) centrado en Córdoba Capital
                    const viewboxCordoba = "-64.35,-31.30,-64.05,-31.55"; 
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=ar&viewbox=${viewboxCordoba}&bounded=0&limit=5`;

                    try {
                        const response = await fetch(url);
                        const data = await response.json();

                        if (resultsContainer) {
                            resultsContainer.innerHTML = "";
                            
                            data.forEach(place => {
                                const item = document.createElement("div");
                                item.className = "search-result-item";
                                item.textContent = place.display_name;
                                
                                item.addEventListener("click", () => {
                                    searchInput.value = place.display_name;
                                    resultsContainer.innerHTML = "";
                                    
                                    if (typeof centrarMapa === 'function') {
                                        centrarMapa(place.lat, place.lon);
                                    }
                                });
                                
                                resultsContainer.appendChild(item);
                            });
                        }
                    } catch (error) {
                        console.error("Error al consultar el servicio de mapas:", error);
                    }
                });
            }
        });

        function centrarMapa(lat, lon) {
            if (window.mapaApp) {
                window.mapaApp.setView([lat, lon], 17);
                L.marker([lat, lon]).addTo(window.mapaApp);
            }
        }
    </script>
</body>
</html>
