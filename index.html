<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>Ruta Segura - HUD Cyberpunk & Pac-Man</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: #000000;
      color: #00f3ff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #map { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      z-index: 1; 
      background: #ffffff;
      transition: background 0.3s ease;
    }

    .leaflet-div-icon {
      background: transparent !important;
      border: none !important;
    }

    .leaflet-container.dark-map .leaflet-tile-pane {
      filter: brightness(85%) contrast(115%);
    }
    .leaflet-container.pacman-map .leaflet-tile-pane {
      filter: invert(100%) hue-rotate(180deg) brightness(70%) contrast(130%);
    }

    .overlay { position: absolute; z-index: 1000; pointer-events: none; }
    .overlay > * { pointer-events: auto; }

    /* Barra Superior */
    .top-bar {
      top: 0; left: 0; right: 0;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(2, 4, 10, 0.95) 0%, rgba(2, 4, 10, 0.65) 80%, transparent 100%);
      display: flex; gap: 10px; align-items: flex-start;
    }
    .search-box { flex: 1; display: flex; flex-direction: column; gap: 8px; position: relative; }
    
    .input-row {
      display: flex; align-items: center; 
      background: rgba(8, 12, 24, 0.92);
      border: 1px solid rgba(0, 243, 255, 0.8); 
      border-radius: 12px; padding: 2px 8px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.05);
      backdrop-filter: blur(12px);
    }
    .input-row input {
      flex: 1; padding: 10px 6px; border: none; background: transparent;
      color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600; outline: none; width: 100%;
    }
    .input-row input::placeholder { color: rgba(0, 243, 255, 0.65); }
    
    .icon-btn {
      background: none; border: none; color: #00f3ff; font-size: 16px;
      cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center;
      text-shadow: 0 0 8px #00f3ff;
    }

    .suggestions-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: rgba(8, 12, 24, 0.98); 
      border: 1px solid #00f3ff;
      border-radius: 12px; margin-top: 6px; max-height: 220px; overflow-y: auto;
      z-index: 9999 !important; display: none; 
      box-shadow: 0 10px 30px rgba(0, 243, 255, 0.4);
      backdrop-filter: blur(16px);
    }
    .suggestion-item {
      padding: 12px 14px; font-size: 14px; color: #ffffff; cursor: pointer;
      border-bottom: 1px solid rgba(0, 243, 255, 0.15); font-weight: 600;
    }
    .suggestion-item:hover {
      background: rgba(0, 243, 255, 0.2);
    }

    .btn {
      padding: 12px 18px; border-radius: 12px; border: none; font-size: 16px;
      font-family: 'Rajdhani', sans-serif; font-weight: 800; cursor: pointer; white-space: nowrap; 
      display: flex; align-items: center; justify-content: center; height: 100%;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .btn-primary { background: #00f3ff; color: #02040a; box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); }
    .btn-danger { background: #ff0055; color: #fff; box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
    .btn-warning { background: #ffb700; color: #000; box-shadow: 0 0 20px rgba(255, 183, 0, 0.6); }
    .btn-success { background: #00ff66; color: #02040a; box-shadow: 0 0 20px rgba(0, 255, 102, 0.6); }

    /* Controles Flotantes */
    .floating-controls {
      position: absolute; right: 16px; top: 18%;
      display: flex; flex-direction: column; gap: 12px;
      align-items: flex-end; z-index: 1500;
    }
    .bubble-group { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    .fab-btn {
      width: 52px; height: 52px; border-radius: 50%; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #00f3ff; cursor: pointer; 
      background: rgba(8, 12, 24, 0.88); backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    }
    .fab-gps { border-color: #00ff66; box-shadow: 0 0 20px rgba(0, 255, 102, 0.5); }
    .fab-theme { border-color: #ffb800; box-shadow: 0 0 20px rgba(255, 184, 0, 0.6); }
    .fab-voice { border-color: #ffb700; box-shadow: 0 0 20px rgba(255, 183, 0, 0.5); }
    .fab-clear { border-color: #ff3300; box-shadow: 0 0 20px rgba(255, 51, 0, 0.6); }
    .fab-horn { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
    .fab-alert { border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }

    .menu-options { display: none; flex-direction: column; gap: 8px; align-items: flex-end; }
    .menu-options.active { display: flex; }

    .menu-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(8, 12, 24, 0.95); padding: 10px 16px; border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.5); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
    }
    .menu-item-danger { border-color: rgba(255, 51, 0, 0.8); }

    .draggable-marker {
      font-size: 28px; 
      background: transparent; 
      border: none; 
      padding: 0; 
      text-align: center;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9));
    }

    .nav-panel {
      bottom: 0; left: 0; right: 0; padding: 0 16px 20px;
      background: linear-gradient(0deg, rgba(2, 4, 10, 0.98) 0%, rgba(2, 4, 10, 0.7) 70%, transparent 100%);
      display: flex; flex-direction: column; gap: 12px;
    }
    .nav-instruction { 
      background: rgba(8, 12, 24, 0.9); border-radius: 16px; padding: 18px; 
      border: 1px solid rgba(0, 243, 255, 0.4); backdrop-filter: blur(16px);
    }
    .nav-instruction .street { font-size: 20px; font-weight: 800; color: #ffffff; }
    .nav-instruction .distance { font-size: 32px; font-weight: 800; color: #00f3ff; }

    .toast { display: none !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Barra Superior HUD -->
  <div class="top-bar overlay">
    <div class="search-box">
      <div class="input-row">
        <button class="icon-btn" onclick="startLiveGPS()" title="GPS Activo">📍</button>
        <input type="text" id="originInput" placeholder="ORIGEN: GPS vivo o esquina (ej: Colón & General Paz)..." oninput="handleSearchInput(this.value, 'origin')">
        <button class="icon-btn" onclick="clearOrigin()" title="Restaurar GPS">🔄</button>
      </div>
      <div class="input-row">
        <span style="font-size:16px; padding:0 6px;">🏁</span>
        <input type="text" id="destInput" placeholder="DESTINO: escribí esquina (ej: Revolucion de Mayo y Madrid)..." oninput="handleSearchInput(this.value, 'dest')">
        <button class="icon-btn" onclick="clearDestination()">❌</button>
      </div>
      <div id="suggestions" class="suggestions-list"></div>
    </div>
    <div class="action-btns">
      <button class="btn btn-primary" onclick="calculateRoute()">🚀 Ir</button>
    </div>
  </div>

  <!-- Burbujas Flotantes -->
  <div class="floating-controls overlay">
    <button class="fab-btn fab-gps" onclick="enableSetOriginMode()" title="Fijar Origen Manual">🚗</button>
    
    <div class="bubble-group">
      <div class="menu-options" id="themeOptions">
        <div class="menu-item" onclick="setTheme('light')"><span>☀️</span> Modo Claro</div>
        <div class="menu-item" onclick="setTheme('dark')"><span>🌙</span> Modo Oscuro</div>
        <div class="menu-item" onclick="setTheme('pacman')"><span>🟡</span> Modo Pac-Man</div>
      </div>
      <button class="fab-btn fab-theme" id="themeBtn" onclick="toggleMenu('themeOptions')" title="Cambiar Tema">🎨</button>
    </div>

    <button class="fab-btn fab-voice" id="voiceToggleBtn" onclick="toggleVoice()" title="Voz Activada">🔊</button>

    <div class="bubble-group">
      <div class="menu-options" id="clearOptions">
        <div class="menu-item" onclick="clearRouteOnly()"><span>🗺️</span> Eliminar Recorrido</div>
        <div class="menu-item" onclick="clearIncidentsOnly()"><span>🚨</span> Eliminar Controles</div>
        <div class="menu-item menu-item-danger" onclick="clearEverything()"><span>💥</span> Eliminar Todo</div>
      </div>
      <button class="fab-btn fab-clear" onclick="toggleMenu('clearOptions')" title="Limpiar Mapa">🗑️</button>
    </div>

    <div class="bubble-group">
      <div class="menu-options" id="hornOptions">
        <div class="menu-item" onclick="reportIncident('control_municipal', 'Control Municipal')"><span>🏛️</span> Control Municipal</div>
        <div class="menu-item" onclick="reportIncident('itv', 'ITV')"><span>🔍</span> ITV</div>
        <div class="menu-item" onclick="reportIncident('radar', 'Radar de velocidad')"><span>📷</span> Radar</div>
        <div class="menu-item" onclick="reportIncident('itv_radar', 'ITV + Radar')"><span>🔍📷</span> ITV + Radar</div>
        <div class="menu-item" onclick="reportIncident('control_transito', 'Control de Tránsito')"><span>🚘</span> Control de Tránsito</div>
      </div>
      <button class="fab-btn fab-horn" onclick="toggleMenu('hornOptions')">📢</button>
    </div>

    <div class="bubble-group">
      <div class="menu-options" id="alertOptions">
        <div class="menu-item" onclick="reportIncident('bache', 'Bache peligroso')"><span>🕳️</span> Bache</div>
        <div class="menu-item" onclick="reportIncident('manifestacion', 'Manifestación')"><span>🪧</span> Manifestación</div>
        <div class="menu-item" onclick="reportIncident('corte', 'Corte de Calle')"><span>🚧</span> Corte de Calle</div>
        <div class="menu-item" onclick="reportIncident('corte_parcial', 'Corte de media calzada')"><span>🔶</span> Corte de media calzada</div>
      </div>
      <button class="fab-btn fab-alert" onclick="toggleMenu('alertOptions')">⚠️</button>
    </div>
  </div>

  <!-- Panel Navegación Inferior -->
  <div class="nav-panel overlay" id="navPanel" style="display:none;">
    <div class="nav-instruction">
      <div class="distance" id="navDistance">--</div>
      <div class="street" id="navStreet">SISTEMA LISTO</div>
      <div class="detail" id="navDetail" style="color:rgba(0, 243, 255, 0.75); font-size:14px; font-weight: 600;">Tocá "Iniciar viaje" para comenzar</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-success" id="btnStart" style="flex:1;" onclick="startNavigation()">▶️ Iniciar viaje</button>
      <button class="btn btn-warning" id="btnDetour" style="display:none; flex:1;" onclick="activateDetour()">🔄 Aplicar Desvío</button>
      <button class="btn btn-primary" id="btnNextDetour" style="display:none; flex:0.6;" onclick="cycleNextDetour()">🔀 Atajo</button>
      <button class="btn btn-danger" id="btnStop" style="display:none; flex:1;" onclick="stopNavigation()">⏹️ Finalizar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';
    const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
    const DEFAULT_ORIGIN = [-31.4201, -64.1888];

    const incidentEmojis = {
      'control_municipal': '🏛️',
      'itv': '🔍',
      'radar': '📷',
      'itv_radar': '🔍📷',
      'control_transito': '🚘',
      'bache': '🕳️',
      'manifestacion': '🪧',
      'corte': '🚧',
      'corte_parcial': '🔶'
    };

    let map, tileLayer = null, userPos = null, destPos = null;
    let currentRoute = null, detourRoute = null;
    let availableDetours = [], currentDetourIndex = 0;
    let routeLayerGroup = null, detourLayerGroup = null;
    let userMarker = null, destMarker = null;
    let activeIncidents = [];
    let debounceTimer = null, settingOriginMode = false;
    let activeInputTarget = 'dest';
    
    let currentTheme = 'light';
    let isVoiceActive = true;
    let watchId = null;
    let isNavigating = false;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      startLiveGPS();
      loadState();
    });

    function saveState() {
      localStorage.setItem('hud_theme', currentTheme);
      localStorage.setItem('hud_voice', isVoiceActive);
      if (destPos) {
        localStorage.setItem('hud_destPos', JSON.stringify(destPos));
        localStorage.setItem('hud_destText', document.getElementById('destInput').value);
      } else {
        localStorage.removeItem('hud_destPos');
        localStorage.removeItem('hud_destText');
      }
      const incData = activeIncidents.map(i => ({
        id: i.id,
        lat: i.pos[0],
        lng: i.pos[1],
        type: i.type,
        label: i.label
      }));
      localStorage.setItem('hud_incidents', JSON.stringify(incData));
    }

    function loadState() {
      const savedTheme = localStorage.getItem('hud_theme');
      if (savedTheme) {
        setTheme(savedTheme, false);
      } else {
        setTheme('light', false);
      }

      const savedVoice = localStorage.getItem('hud_voice');
      if (savedVoice === 'false') {
        isVoiceActive = false;
        const btn = document.getElementById('voiceToggleBtn');
        btn.textContent = '🔇';
        btn.title = 'Voz Desactivada';
      }

      const savedDestPos = localStorage.getItem('hud_destPos');
      const savedDestText = localStorage.getItem('hud_destText');
      if (savedDestPos) {
        destPos = JSON.parse(savedDestPos);
        if (savedDestText) {
          document.getElementById('destInput').value = savedDestText;
        }
        if (destMarker) map.removeLayer(destMarker);
        destMarker = L.marker(destPos, {
          icon: L.divIcon({ html: '<div style="font-size:28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)); background: transparent;">🟡</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
        }).addTo(map);
      }

      const savedIncidents = localStorage.getItem('hud_incidents');
      if (savedIncidents) {
        try {
          const incArray = JSON.parse(savedIncidents);
          incArray.forEach(inc => {
            restoreIncidentMarker(inc.lat, inc.lng, inc.type, inc.label, inc.id);
          });
        } catch(e){}
      }

      if (userPos && destPos) {
        recalculateSmartRoute();
      }
    }

    function speak(text) {
      if (!isVoiceActive || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-AR';
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function toggleVoice() {
      isVoiceActive = !isVoiceActive;
      const btn = document.getElementById('voiceToggleBtn');
      if (isVoiceActive) {
        btn.textContent = '🔊';
        btn.title = 'Voz Activada';
        showToast('🔊 Dictado por voz activado', true);
      } else {
        btn.textContent = '🔇';
        btn.title = 'Voz Desactivada';
        window.speechSynthesis.cancel();
        showToast('🔇 Dictado por voz silenciado', false);
      }
      saveState();
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(DEFAULT_ORIGIN, 14);
      
      tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19, subdomains: 'abcd', attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);

      setTimeout(() => { map.invalidateSize(); }, 300);

      map.on('click', function(e) {
        document.getElementById('suggestions').style.display = 'none';
        closeAllMenus();
        if (settingOriginMode) {
          setOriginFromMap(e.latlng);
          settingOriginMode = false;
        } else {
          setDestinationFromMap(e.latlng);
        }
      });
    }

    function setTheme(theme, showToastMsg = true) {
      currentTheme = theme;
      closeAllMenus();
      const mapContainer = document.getElementById('map');
      const themeBtn = document.getElementById('themeBtn');

      mapContainer.classList.remove('dark-map', 'pacman-map');

      if (theme === 'light') {
        if (tileLayer) map.removeLayer(tileLayer);
        tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/light_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19, subdomains: 'abcd'
        }).addTo(map);
        mapContainer.style.background = '#ffffff';
        themeBtn.textContent = '☀️';
        themeBtn.title = 'Modo Claro Activo';
        if (showToastMsg) showToast('☀️ Modo Claro Activado', true);

      } else if (theme === 'dark') {
        if (tileLayer) map.removeLayer(tileLayer);
        tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19, subdomains: 'abcd'
        }).addTo(map);
        mapContainer.style.background = '#0d1117';
        themeBtn.textContent = '🌙';
        themeBtn.title = 'Modo Oscuro Activo';
        if (showToastMsg) showToast('🌙 Modo Oscuro Activado', true);

      } else if (theme === 'pacman') {
        if (tileLayer) map.removeLayer(tileLayer);
        tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19, subdomains: 'abcd'
        }).addTo(map);
        mapContainer.classList.add('pacman-map');
        mapContainer.style.background = '#000000';
        themeBtn.textContent = '🟡';
        themeBtn.title = 'Modo Pac-Man Activo';
        if (showToastMsg) showToast('🟡 ¡Modo Pac-Man Activado! (Baches con 💩 y Fantasmas clásicos)', true);
      }

      updateUserMarker();
      updateAllIncidentMarkers();
      if (currentRoute) drawRoute(currentRoute.coords, false);
      saveState();
    }

    function clearRouteOnly() {
      closeAllMenus();
      destPos = null;
      document.getElementById('destInput').value = '';
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
      clearRoutes();
      if (navigator.geolocation) {
        startLiveGPS();
      }
      saveState();
      showToast('Recorrido eliminado (GPS conservado)', true);
    }

    function clearIncidentsOnly() {
      closeAllMenus();
      activeIncidents.forEach(inc => map.removeLayer(inc.marker));
      activeIncidents = [];
      if (detourLayerGroup) map.removeLayer(detourLayerGroup);
      document.getElementById('btnDetour').style.display = 'none';
      document.getElementById('btnNextDetour').style.display = 'none';
      saveState();
      showToast('Todos los controles eliminados', true);
      if (userPos && destPos) recalculateSmartRoute();
    }

    function clearEverything() {
      clearRouteOnly();
      clearIncidentsOnly();
      saveState();
      showToast('Todo fue eliminado del mapa', true);
    }

    function startLiveGPS() {
      if (!navigator.geolocation) {
        showToast('Tu navegador no soporta geolocalización', true);
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }

      showToast('Radar GPS continuo activo...', false);

      watchId = navigator.geolocation.watchPosition(
        pos => {
          userPos = [pos.coords.latitude, pos.coords.longitude];
          document.getElementById('originInput').value = 'Mi ubicación actual (GPS vivo)';
          updateUserMarker();

          if (isNavigating) {
            map.setView(userPos, 16, { animate: true });
          }
        },
        err => {
          console.warn('Error de GPS:', err.message);
          if (!userPos) {
            userPos = DEFAULT_ORIGIN;
            document.getElementById('originInput').value = 'Córdoba Centro (Predeterminado)';
            updateUserMarker();
          }
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    }

    function updateUserMarker() {
      if (!userPos) return;
      
      const markerHtml = currentTheme === 'pacman' 
        ? `<div style="filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9)); text-align:center; background: transparent;">
             <svg width="36" height="36" viewBox="0 0 100 100">
               <path d="M 50 50 L 92 22 A 50 50 0 1 0 92 78 Z" fill="#ffeb00"/>
               <circle cx="50" cy="28" r="6" fill="#000"/>
             </svg>
           </div>`
        : '<div style="width:24px;height:24px;background:#ffb800;border-radius:50%;border:3px solid #fff;box-shadow:0 0 20px #ffb800;"></div>';

      if (!userMarker) {
        userMarker = L.marker(userPos, {
          icon: L.divIcon({
            html: markerHtml,
            iconSize: [36, 36], iconAnchor: [18, 18]
          })
        }).addTo(map);
      } else {
        userMarker.setLatLng(userPos);
        userMarker.setIcon(L.divIcon({
          html: markerHtml,
          iconSize: [36, 36], iconAnchor: [18, 18]
        }));
      }
    }

    function getGhostSvgHtml(type) {
      if (type === 'bache' || type === 'manifestacion' || type === 'corte' || type === 'corte_parcial') {
        return `<div style="font-size:32px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)); background: transparent; text-align:center;">💩</div>`;
      }

      let color = '#ff0000';
      if (type === 'itv') color = '#00f3ff';
      else if (type === 'radar') color = '#ffb800';
      else if (type === 'itv_radar') color = '#ff77ff';
      else if (type === 'control_transito') color = '#ff0000';

      return `<svg width="38" height="38" viewBox="0 0 24 24" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)); background: transparent;">
        <path d="M12 2C7.03 2 3 6.03 3 11v11l2-1.5 2 1.5 2-1.5 2 1.5 2-1.5 2 1.5V11c0-4.97-4.03-9-9-9z" fill="${color}"/>
        <circle cx="8.5" cy="9.5" r="2" fill="#fff"/><circle cx="9" cy="9.5" r="1" fill="#000"/>
        <circle cx="15.5" cy="9.5" r="2" fill="#fff"/><circle cx="16" cy="9.5" r="1" fill="#000"/>
      </svg>`;
    }

    function updateAllIncidentMarkers() {
      activeIncidents.forEach(inc => {
        const markerContent = currentTheme === 'pacman' 
          ? getGhostSvgHtml(inc.type) 
          : `<div class="draggable-marker">${incidentEmojis[inc.type] || '⚠️'}</div>`;

        inc.marker.setIcon(L.divIcon({
          html: markerContent,
          iconSize: [38, 38], iconAnchor: [19, 19]
        }));
      });
    }

    function enableSetOriginMode() {
      settingOriginMode = true;
      showToast('Tocá en el mapa para fijar tu origen manual', true);
    }

    async function setOriginFromMap(latlng) {
      userPos = [latlng.lat, latlng.lng];
      updateUserMarker();
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) document.getElementById('originInput').value = data.display_name.split(',')[0];
      } catch(e){}
      if (destPos) recalculateSmartRoute();
    }

    async function setDestinationFromMap(latlng) {
      destPos = [latlng.lat, latlng.lng];
      if (destMarker) map.removeLayer(destMarker);
      destMarker = L.marker(destPos, {
        icon: L.divIcon({ html: '<div style="font-size:28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)); background: transparent;">🟡</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
      }).addTo(map);

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) document.getElementById('destInput').value = data.display_name.split(',')[0];
      } catch(e){}

      saveState();
      if (userPos) recalculateSmartRoute();
    }

    function handleSearchInput(query, target) {
      activeInputTarget = target;
      clearTimeout(debounceTimer);
      const suggBox = document.getElementById('suggestions');
      if (!query || query.trim().length < 2) { 
        suggBox.style.display = 'none'; 
        return; 
      }

      suggBox.innerHTML = '<div class="suggestion-item" style="color:rgba(0,243,255,0.7);">Buscando en Córdoba...</div>';
      suggBox.style.display = 'block';

      debounceTimer = setTimeout(async () => {
        let cleanQuery = query.trim();
        
        // Generar variantes inteligentes para esquinas en Córdoba
        let queriesToTry = [
          cleanQuery + ', Córdoba, Argentina',
          cleanQuery.replace(/\s+y\s+/gi, ' & ') + ', Córdoba, Argentina',
          cleanQuery.replace(/\s+&\s+/gi, ' y ') + ', Córdoba, Argentina'
        ];

        const parts = cleanQuery.split(/\s+(?:y|&)\s+/i);
        if (parts.length === 2) {
          queriesToTry.push(`${parts[1]} y ${parts[0]}, Córdoba, Argentina`);
        }

        queriesToTry = [...new Set(queriesToTry)];
        let foundPlaces = [];

        for (let q of queriesToTry) {
          const url = `${NOMINATIM_URL}?format=json&q=${encodeURIComponent(q)}&countrycodes=ar&limit=5`;
          try {
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.length > 0) {
              foundPlaces = data;
              break;
            }
          } catch (e) {}
        }

        suggBox.innerHTML = '';
        if (foundPlaces.length > 0) {
          foundPlaces.forEach(place => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.textContent = place.display_name;
            item.onclick = () => {
              const latlng = [parseFloat(place.lat), parseFloat(place.lon)];
              if (activeInputTarget === 'origin') {
                userPos = latlng;
                document.getElementById('originInput').value = place.display_name.split(',')[0];
                updateUserMarker();
              } else {
                destPos = latlng;
                document.getElementById('destInput').value = place.display_name.split(',')[0];
                if (destMarker) map.removeLayer(destMarker);
                destMarker = L.marker(destPos, {
                  icon: L.divIcon({ html: '<div style="font-size:28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)); background: transparent;">🟡</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
                }).addTo(map);
                saveState();
              }
              suggBox.style.display = 'none';
              map.setView(latlng, 15);
              if (userPos && destPos) recalculateSmartRoute();
            };
            suggBox.appendChild(item);
          });
          suggBox.style.display = 'block';
        } else {
          if (parts.length > 0 && parts[0].length > 2) {
            try {
              const fallbackUrl = `${NOMINATIM_URL}?format=json&q=${encodeURIComponent(parts[0] + ', Córdoba, Argentina')}&countrycodes=ar&limit=3`;
              const fbRes = await fetch(fallbackUrl);
              const fbData = await fbRes.json();
              if (fbData && fbData.length > 0) {
                suggBox.innerHTML = '<div style="padding:8px; font-size:12px; color:#ffb800; background:rgba(0,0,0,0.8);">Esquina exacta no hallada. ¿Querés elegir esta aproximación?:</div>';
                fbData.forEach(place => {
                  const item = document.createElement('div');
                  item.className = 'suggestion-item';
                  item.textContent = place.display_name;
                  item.onclick = () => {
                    const latlng = [parseFloat(place.lat), parseFloat(place.lon)];
                    destPos = latlng;
                    document.getElementById('destInput').value = place.display_name.split(',')[0];
                    if (destMarker) map.removeLayer(destMarker);
                    destMarker = L.marker(destPos, {
                      icon: L.divIcon({ html: '<div style="font-size:28px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)); background: transparent;">🟡</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
                    }).addTo(map);
                    saveState();
                    suggBox.style.display = 'none';
                    map.setView(latlng, 15);
                    if (userPos && destPos) recalculateSmartRoute();
                  };
                  suggBox.appendChild(item);
                });
                suggBox.style.display = 'block';
                return;
              }
            } catch(e){}
          }
          suggBox.innerHTML = '<div class="suggestion-item" style="color:#ff0055;">No se encontró la esquina. Probá tocando directamente en el mapa.</div>';
          suggBox.style.display = 'block';
        }
      }, 300);
    }

    function clearOrigin() {
      startLiveGPS();
      showToast('🔄 Ubicación GPS restablecida y bloqueada', true);
    }

    function clearDestination() {
      destPos = null;
      document.getElementById('destInput').value = '';
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
      clearRoutes();
      saveState();
    }

    function clearRoutes() {
      if (routeLayerGroup) map.removeLayer(routeLayerGroup);
      if (detourLayerGroup) map.removeLayer(detourLayerGroup);
      document.getElementById('navPanel').style.display = 'none';
    }

    function toggleMenu(menuId) {
      const target = document.getElementById(menuId);
      const isOpen = target.classList.contains('active');
      closeAllMenus();
      if (!isOpen) target.classList.add('active');
    }

    function closeAllMenus() {
      document.getElementById('themeOptions').classList.remove('active');
      document.getElementById('clearOptions').classList.remove('active');
      document.getElementById('hornOptions').classList.remove('active');
      document.getElementById('alertOptions').classList.remove('active');
    }

    function reportIncident(type, label) {
      closeAllMenus();
      const centerPos = map.getCenter();
      createIncidentMarker(centerPos.lat, centerPos.lng, type, label, Date.now());
      saveState();
      const alertName = currentTheme === 'pacman' && (type === 'bache' || type === 'manifestacion' || type === 'corte' || type === 'corte_parcial') ? 'Bache 💩' : label;
      showToast(`Atención: Alerta de ${alertName} reportada`, true);
      recalculateSmartRoute();
    }

    function createIncidentMarker(lat, lng, type, label, id) {
      const latlng = [lat, lng];
      const markerContent = currentTheme === 'pacman' 
        ? getGhostSvgHtml(type) 
        : `<div class="draggable-marker">${incidentEmojis[type] || '⚠️'}</div>`;
      
      const incidentMarker = L.marker(latlng, {
        draggable: true,
        icon: L.divIcon({
          html: markerContent,
          iconSize: [38, 38], iconAnchor: [19, 19]
        })
      }).addTo(map);

      const incidentObj = { id: id || Date.now(), type, label, pos: latlng, marker: incidentMarker };
      activeIncidents.push(incidentObj);

      const popupContent = document.createElement('div');
      popupContent.style.textAlign = 'center';
      popupContent.innerHTML = `<div style="font-weight:bold;">${label}</div>`;
      
      const deleteBtn = document.createElement('button');
      deleteBtn.style.cssText = 'background:#ff0055; color:#fff; border:none; padding:8px 12px; border-radius:8px; width:100%; margin-top:6px; cursor:pointer; font-weight:800;';
      deleteBtn.innerHTML = '❌ ELIMINAR';
      deleteBtn.onclick = () => { 
        map.removeLayer(incidentMarker); 
        activeIncidents = activeIncidents.filter(i => i.id !== incidentObj.id);
        saveState();
        recalculateSmartRoute();
      };
      
      popupContent.appendChild(deleteBtn);
      incidentMarker.bindPopup(popupContent);

      incidentMarker.on('dragend', function(event) {
        const newPos = event.target.getLatLng();
        incidentObj.pos = [newPos.lat, newPos.lng];
        saveState();
        recalculateSmartRoute();
      });
    }

    function restoreIncidentMarker(lat, lng, type, label, id) {
      createIncidentMarker(lat, lng, type, label, id);
    }

    async function fetchOSRM(points) {
      const coords = points.map(p => `${p[1]},${p[0]}`).join(';');
      const url = `${OSRM_URL}${coords}?overview=full&geometries=geojson&steps=true&alternatives=3`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes.length > 0) {
          return data.routes.map(r => ({
            coords: r.geometry.coordinates.map(c => [c[1], c[0]]),
            distance: r.distance,
            duration: r.duration
          }));
        }
      } catch (e) {}
      return [];
    }

    function calculateRoute() {
      document.getElementById('suggestions').style.display = 'none';
      if (!userPos || !destPos) {
        showToast('Por favor, asegurá tu destino en el mapa', true);
        return;
      }
      recalculateSmartRoute();
    }

    const SAFETY_BUFFER_METERS = 100;

    function isRouteSafe(coords) {
      if (activeIncidents.length === 0) return true;
      return coords.every(coord => {
        return activeIncidents.every(incident => {
          return getDistanceMeters(coord, incident.pos) > SAFETY_BUFFER_METERS;
        });
      });
    }

    async function recalculateSmartRoute() {
      if (!userPos || !destPos) return;

      const directRoutes = await fetchOSRM([userPos, destPos]);
      if (directRoutes.length === 0) return;

      currentRoute = directRoutes[0];
      drawRoute(currentRoute.coords, false);
      updateNavInfo(currentRoute);

      if (activeIncidents.length === 0 || isRouteSafe(currentRoute.coords)) {
        if (detourLayerGroup) map.removeLayer(detourLayerGroup);
        document.getElementById('btnDetour').style.display = 'none';
        document.getElementById('btnNextDetour').style.display = 'none';
        availableDetours = [];
        return;
      }

      let validCandidates = [];

      for (let r of directRoutes) {
        if (isRouteSafe(r.coords)) {
          validCandidates.push(r);
        }
      }

      if (validCandidates.length === 0) {
        validCandidates = await findBypassRoutes([0.002, -0.002, 0.004, -0.004]);
      }

      if (validCandidates.length === 0) {
        validCandidates = await findBypassRoutes([0.008, -0.008, 0.012, -0.012, 0.016, -0.016]);
      }

      if (validCandidates.length > 0) {
        validCandidates.sort((a, b) => a.distance - b.distance);
        availableDetours = validCandidates;
        currentDetourIndex = 0;

        renderCurrentDetour();
        document.getElementById('btnDetour').style.display = 'block';
        document.getElementById('btnNextDetour').style.display = availableDetours.length > 1 ? 'block' : 'none';

        showToast(`Atención: ${availableDetours.length} atajo(s) despejado(s) hallados`, true);
      } else {
        if (detourLayerGroup) map.removeLayer(detourLayerGroup);
        document.getElementById('btnDetour').style.display = 'none';
        document.getElementById('btnNextDetour').style.display = 'none';
        availableDetours = [];
        showToast('Precaución: No hay rutas completamente despejadas', true);
      }
    }

    async function findBypassRoutes(offsets) {
      let promises = [];
      for (let incident of activeIncidents) {
        const cLat = incident.pos[0];
        const cLng = incident.pos[1];
        for (let latOff of offsets) {
          for (let lngOff of offsets) {
            const bypass = [cLat + latOff, cLng + lngOff];
            if (activeIncidents.every(inc => getDistanceMeters(bypass, inc.pos) > SAFETY_BUFFER_METERS)) {
              promises.push(fetchOSRM([userPos, bypass, destPos]));
            }
          }
        }
      }

      const resultsArray = await Promise.all(promises);
      let candidates = [];

      resultsArray.forEach(routes => {
        routes.forEach(tRoute => {
          if (isRouteSafe(tRoute.coords)) {
            if (!candidates.some(r => Math.abs(r.distance - tRoute.distance) < 40)) {
              candidates.push(tRoute);
            }
          }
        });
      });

      return candidates;
    }

    function renderCurrentDetour() {
      if (availableDetours.length === 0) return;
      detourRoute = availableDetours[currentDetourIndex];
      drawRoute(detourRoute.coords, true);
    }

    function cycleNextDetour() {
      if (availableDetours.length <= 1) return;
      currentDetourIndex = (currentDetourIndex + 1) % availableDetours.length;
      renderCurrentDetour();
      showToast(`Atajo alternativo ${currentDetourIndex + 1}`, true);
    }

    function getDistanceMeters(p1, p2) {
      const R = 6371000;
      const dLat = (p2[0] - p1[0]) * Math.PI / 180;
      const dLon = (p2[1] - p1[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(p1[0] * Math.PI / 180) * Math.cos(p2[0] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function drawRoute(coords, isDetour) {
      if (isDetour && detourLayerGroup) map.removeLayer(detourLayerGroup);
      if (!isDetour && routeLayerGroup) map.removeLayer(routeLayerGroup);

      const group = L.layerGroup();
      
      let mainColor = isDetour ? '#ff007f' : '#ffb800';
      let dashOption = null;

      if (currentTheme === 'pacman') {
        mainColor = isDetour ? '#ff007f' : '#ffb800';
        dashOption = '3, 16';
      }

      const glowLine = L.polyline(coords, { 
        color: mainColor, 
        weight: isDetour ? 10 : 12, 
        opacity: 0.4, 
        lineCap: 'round', 
        lineJoin: 'round',
        dashArray: dashOption 
      });
      
      const coreLine = L.polyline(coords, { 
        color: currentTheme === 'pacman' ? '#ffb800' : '#ffffff', 
        weight: isDetour ? 4 : 5, 
        opacity: 1, 
        lineCap: 'round', 
        lineJoin: 'round',
        dashArray: dashOption 
      });

      group.addLayer(glowLine); 
      group.addLayer(coreLine); 
      group.addTo(map);

      if (isDetour) detourLayerGroup = group;
      else routeLayerGroup = group;
    }

    function updateNavInfo(routeData) {
      document.getElementById('navPanel').style.display = 'flex';
      document.getElementById('btnStart').style.display = 'block';
      const distKm = (routeData.distance / 1000).toFixed(1);
      document.getElementById('navDistance').textContent = `${distKm} km`;
      document.getElementById('navStreet').textContent = 'RUTA CALCULADA';
    }

    function activateDetour() {
      if (!detourRoute) return;
      drawRoute(detourRoute.coords, false);
      if (detourLayerGroup) map.removeLayer(detourLayerGroup);
      currentRoute = detourRoute;
      document.getElementById('btnDetour').style.display = 'none';
      document.getElementById('btnNextDetour').style.display = 'none';
      showToast('Navegando por el atajo', true);
    }

    function startNavigation() {
      isNavigating = true;
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnDetour').style.display = 'none';
      document.getElementById('btnNextDetour').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      document.getElementById('navStreet').textContent = 'NAVEGANDO...';
      document.getElementById('navDetail').textContent = 'Seguimiento de GPS en vivo activo';
      showToast('Viaje iniciado. GPS en tiempo real activado', true);
    }

    function stopNavigation() {
      isNavigating = false;
      document.getElementById('btnStop').style.display = 'none';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('navStreet').textContent = 'SISTEMA LISTO';
      document.getElementById('navDetail').textContent = 'Tocá "Iniciar viaje" para comenzar';
      showToast('Viaje finalizado', true);
    }

    function showToast(msg, speakIt = false) {
      if (speakIt) speak(msg);
    }
  </script>
</body>
