<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <!-- CABECERAS ANTI-CACHÉ -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <title>Ruta Segura - HUD Cyberpunk</title>
  
  <!-- FUENTE FUTURISTA -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Rajdhani', sans-serif;
      background: #030712;
      color: #00f3ff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #map { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      z-index: 1; 
      background: #030712;
    }
    .overlay { position: absolute; z-index: 1000; pointer-events: none; }
    .overlay > * { pointer-events: auto; }

    /* Barra Superior - HUD Style */
    .top-bar {
      top: 0; left: 0; right: 0;
      padding: 14px 16px;
      background: linear-gradient(180deg, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0.6) 80%, transparent 100%);
      display: flex; gap: 10px; align-items: flex-start;
    }
    .search-box { flex: 1; display: flex; flex-direction: column; gap: 8px; position: relative; }
    
    .input-row {
      display: flex; align-items: center; 
      background: rgba(10, 15, 30, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4); 
      border-radius: 12px; padding: 2px 8px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15), inset 0 0 10px rgba(0, 243, 255, 0.05);
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
    }
    .input-row:focus-within { 
      border-color: #00f3ff; 
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5), inset 0 0 12px rgba(0, 243, 255, 0.2); 
    }
    
    .input-row input {
      flex: 1; padding: 10px 6px; border: none; background: transparent;
      color: #ffffff; font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600; outline: none; width: 100%;
    }
    .input-row input::placeholder { color: rgba(0, 243, 255, 0.5); }
    
    .icon-btn {
      background: none; border: none; color: #00f3ff; font-size: 16px;
      cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center;
      text-shadow: 0 0 8px #00f3ff;
    }
    .icon-btn:active { transform: scale(1.2); }

    .suggestions-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: rgba(10, 15, 30, 0.95); 
      border: 1px solid #00f3ff;
      border-radius: 12px; margin-top: 6px; max-height: 220px; overflow-y: auto;
      z-index: 9999 !important; display: none; 
      box-shadow: 0 10px 30px rgba(0, 243, 255, 0.3);
      backdrop-filter: blur(16px);
    }
    .suggestion-item {
      padding: 12px 14px; font-size: 14px; color: #e2e8f0; cursor: pointer;
      border-bottom: 1px solid rgba(0, 243, 255, 0.15);
      font-weight: 600;
    }
    .suggestion-item:hover { background: rgba(0, 243, 255, 0.2); color: #00f3ff; }
    
    .action-btns { display: flex; align-self: stroke; }
    .btn {
      padding: 12px 18px; border-radius: 12px; border: none; font-size: 16px;
      font-family: 'Rajdhani', sans-serif; font-weight: 800; cursor: pointer; white-space: nowrap; 
      display: flex; align-items: center; justify-content: center; height: 100%;
      text-transform: uppercase; letter-spacing: 1px;
      transition: all 0.2s ease;
    }
    .btn-primary { 
      background: #00f3ff; color: #030712; 
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.6); 
    }
    .btn-primary:active { transform: scale(0.95); box-shadow: 0 0 30px rgba(0, 243, 255, 0.9); }
    
    .btn-danger { background: #ff0055; color: #fff; box-shadow: 0 0 20px rgba(255, 0, 85, 0.6); }
    .btn-warning { background: #ffb700; color: #000; box-shadow: 0 0 20px rgba(255, 183, 0, 0.6); }
    .btn-success { background: #00ff66; color: #030712; box-shadow: 0 0 20px rgba(0, 255, 102, 0.6); }

    /* CONTENEDOR DE BURBUJAS FLOTANTES (NEÓN) */
    .floating-controls {
      position: absolute; right: 16px; top: 22%;
      display: flex; flex-direction: column; gap: 16px;
      align-items: flex-end; z-index: 1500;
    }

    .bubble-group { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    .fab-btn {
      width: 54px; height: 54px; border-radius: 50%; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #00f3ff; cursor: pointer; 
      background: rgba(10, 15, 30, 0.85); backdrop-filter: blur(10px);
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
      transition: all 0.2s ease;
    }
    .fab-btn:active { transform: scale(1.1); }
    .fab-gps { border-color: #00ff66; box-shadow: 0 0 20px rgba(0, 255, 102, 0.5); }
    .fab-horn { border-color: #00f3ff; box-shadow: 0 0 20px rgba(0, 243, 255, 0.5); }
    .fab-alert { border-color: #ff0055; box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }

    .menu-options {
      display: none; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .menu-options.active { display: flex; }

    .menu-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(10, 15, 30, 0.9); padding: 10px 16px; border-radius: 20px;
      border: 1px solid rgba(0, 243, 255, 0.4); color: #fff; font-size: 14px;
      font-weight: 700; cursor: pointer; white-space: nowrap;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      backdrop-filter: blur(12px);
    }
    .menu-item:active { background: rgba(0, 243, 255, 0.3); }

    .draggable-marker {
      font-size: 26px; background: rgba(10, 15, 30, 0.9); padding: 6px;
      border-radius: 50%; border: 2px solid #ff0055; text-align: center; cursor: grab;
      box-shadow: 0 0 20px #ff0055;
    }

    /* Popups estilo Cyberpunk */
    .leaflet-popup-content-wrapper { 
      background: rgba(10, 15, 30, 0.95) !important; 
      color: #00f3ff !important; 
      border-radius: 12px !important; 
      border: 1px solid #00f3ff !important;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.4) !important;
      font-family: 'Rajdhani', sans-serif !important;
    }
    .leaflet-popup-tip { background: #00f3ff !important; }
    .popup-delete-btn { 
      background: #ff0055; color: #fff; border: none; padding: 8px 12px; 
      border-radius: 8px; width: 100%; margin-top: 6px; cursor: pointer; 
      font-family: 'Rajdhani', sans-serif; font-weight: 800;
      box-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
    }

    /* Panel Inferior HUD */
    .nav-panel {
      bottom: 0; left: 0; right: 0; padding: 0 16px 20px;
      background: linear-gradient(0deg, rgba(3, 7, 18, 0.98) 0%, rgba(3, 7, 18, 0.7) 70%, transparent 100%);
      display: flex; flex-direction: column; gap: 12px;
    }
    .nav-instruction { 
      background: rgba(10, 15, 30, 0.9); 
      border-radius: 16px; padding: 18px; 
      border: 1px solid rgba(0, 243, 255, 0.3); 
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.15);
      backdrop-filter: blur(16px);
    }
    .nav-instruction .street { font-size: 20px; font-weight: 800; color: #ffffff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
    .nav-instruction .distance { font-size: 32px; font-weight: 800; color: #00f3ff; text-shadow: 0 0 15px #00f3ff; }

    .toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10, 15, 30, 0.95); color: #00f3ff; padding: 14px 24px;
      border-radius: 12px; font-size: 16px; font-weight: 700; z-index: 3000; display: none;
      border: 1px solid #00f3ff; text-align: center;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.5);
      backdrop-filter: blur(16px);
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Barra Superior HUD -->
  <div class="top-bar overlay">
    <div class="search-box">
      <!-- Fila 1: Origen -->
      <div class="input-row">
        <button class="icon-btn" onclick="getUserLocation()" title="Usar GPS actual">📍</button>
        <input type="text" id="originInput" placeholder="ORIGEN: escribí o tocá el mapa..." oninput="handleSearchInput(this.value, 'origin')">
        <button class="icon-btn" onclick="clearOrigin()" title="Borrar Origen">❌</button>
      </div>
      
      <!-- Fila 2: Destino -->
      <div class="input-row">
        <span style="font-size:16px; padding:0 6px;">🏁</span>
        <input type="text" id="destInput" placeholder="DESTINO: escribí o tocá el mapa..." oninput="handleSearchInput(this.value, 'dest')">
        <button class="icon-btn" onclick="clearDestination()" title="Borrar Destino">❌</button>
      </div>

      <div id="suggestions" class="suggestions-list"></div>
    </div>

    <div class="action-btns">
      <button class="btn btn-primary" onclick="calculateRoute()">🚀 Ir</button>
    </div>
  </div>

  <!-- BURBUJAS FLOTANTES NEÓN -->
  <div class="floating-controls overlay">
    <button class="fab-btn fab-gps" onclick="enableSetOriginMode()" title="Marcar punto de origen en el mapa">🚗</button>

    <!-- Inspecciones -->
    <div class="bubble-group">
      <div class="menu-options" id="hornOptions">
        <div class="menu-item" onclick="reportIncident('control_municipal', '🏛️ Control Municipal')"><span>🏛️</span> Control Municipal</div>
        <div class="menu-item" onclick="reportIncident('itv', '🔍 ITV')"><span>🔍</span> ITV</div>
        <div class="menu-item" onclick="reportIncident('radar', '📷 Radar')"><span>📷</span> Radar</div>
        <div class="menu-item" onclick="reportIncident('control_transito', '🚘 Control de Tránsito')"><span>🚘</span> Control de Tránsito</div>
        <div class="menu-item" onclick="reportIncident('control_transporte', '🚌 Control Transporte')"><span>🚌</span> Control Transporte</div>
        <div class="menu-item" onclick="reportIncident('control_policial', '🚨 Control Policial')"><span>🚨</span> Control Policial</div>
      </div>
      <button class="fab-btn fab-horn" onclick="toggleMenu('hornOptions')">📢</button>
    </div>

    <!-- Imprevistos -->
    <div class="bubble-group">
      <div class="menu-options" id="alertOptions">
        <div class="menu-item" onclick="reportIncident('bache', '🕳️ Bache')"><span>🕳️</span> Bache</div>
        <div class="menu-item" onclick="reportIncident('manifestacion', '🪧 Manifestación')"><span>🪧</span> Manifestación</div>
        <div class="menu-item" onclick="reportIncident('corte', '🚧 Corte de Calle')"><span>🚧</span> Corte de Calle</div>
      </div>
      <button class="fab-btn fab-alert" onclick="toggleMenu('alertOptions')">⚠️</button>
    </div>
  </div>

  <!-- Panel Navegación Inferior -->
  <div class="nav-panel overlay" id="navPanel" style="display:none;">
    <div class="nav-instruction">
      <div class="distance" id="navDistance">--</div>
      <div class="street" id="navStreet">SISTEMA LISTO</div>
      <div class="detail" id="navDetail" style="color:rgba(0, 243, 255, 0.7); font-size:14px; font-weight: 600;">Tocá "Iniciar viaje" para comenzar</div>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn btn-success" id="btnStart" style="flex:1;" onclick="startNavigation()">▶️ Iniciar viaje</button>
      <button class="btn btn-warning" id="btnDetour" style="display:none; flex:1;" onclick="activateDetour()">🔄 Aplicar Desvío</button>
      <button class="btn btn-primary" id="btnNextDetour" style="display:none; flex:0.6;" onclick="cycleNextDetour()">🔀 Atajo</button>
      <button class="btn btn-danger" id="btnStop" style="display:none; flex:1;" onclick="stopNavigation()">⏹️ Finalizar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) { registration.unregister(); }
      });
    }

    const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';
    const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
    const DEFAULT_ORIGIN = [-31.4201, -64.1888];

    let map, userPos = null, destPos = null;
    let currentRoute = null, detourRoute = null;
    let availableDetours = [];
    let currentDetourIndex = 0;

    let routeLayerGroup = null, detourLayerGroup = null;
    let userMarker = null, destMarker = null;
    let activeIncidents = [];
    let debounceTimer = null;
    let settingOriginMode = false;
    let activeInputTarget = 'dest';

    const SAFETY_BUFFER_METERS = 100;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      getUserLocation();
    });

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(DEFAULT_ORIGIN, 14);

      // MAPA BASE DARK CYBERPUNK (CartoDB Dark Matter)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd',
        attribution: '&copy; OpenStreetMap &copy; CARTO'
      }).addTo(map);

      setTimeout(() => { map.invalidateSize(); }, 300);
      window.addEventListener('resize', () => { map.invalidateSize(); });

      map.on('click', function(e) {
        document.getElementById('suggestions').style.display = 'none';
        closeAllMenus();
        
        if (settingOriginMode) {
          setOriginFromMap(e.latlng);
          settingOriginMode = false;
        } else {
          setDestinationFromMap(e.latlng);
        }
      });
    }

    function getUserLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => {
          userPos = [pos.coords.latitude, pos.coords.longitude];
          document.getElementById('originInput').value = 'Mi ubicación actual';
          updateUserMarker();
          map.setView(userPos, 15);
          showToast('📍 Posición GPS fijada');
        },
        () => {
          userPos = DEFAULT_ORIGIN;
          document.getElementById('originInput').value = 'Córdoba Centro';
          updateUserMarker();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function updateUserMarker() {
      if (!userPos) return;
      if (!userMarker) {
        userMarker = L.marker(userPos, {
          icon: L.divIcon({
            html: '<div style="width:22px;height:22px;background:#00ff66;border-radius:50%;border:3px solid #fff;box-shadow:0 0 18px #00ff66;"></div>',
            iconSize: [22, 22], iconAnchor: [11, 11]
          })
        }).addTo(map);
      } else {
        userMarker.setLatLng(userPos);
      }
    }

    function enableSetOriginMode() {
      settingOriginMode = true;
      showToast('👉 Tocá en el mapa para fijar tu ORIGEN (🚗)');
    }

    async function setOriginFromMap(latlng) {
      userPos = [latlng.lat, latlng.lng];
      updateUserMarker();
      
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) {
          document.getElementById('originInput').value = data.display_name.split(',')[0];
        }
      } catch(e){}

      if (destPos) recalculateSmartRoute();
    }

    async function setDestinationFromMap(latlng) {
      destPos = [latlng.lat, latlng.lng];

      if (destMarker) map.removeLayer(destMarker);
      destMarker = L.marker(destPos, {
        icon: L.divIcon({ html: '<div style="font-size:28px; filter: drop-shadow(0 0 10px #00f3ff);">🏁</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
      }).addTo(map);

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) {
          document.getElementById('destInput').value = data.display_name.split(',')[0];
        }
      } catch(e){}

      if (userPos) recalculateSmartRoute();
    }

    function handleSearchInput(query, target) {
      activeInputTarget = target;
      clearTimeout(debounceTimer);
      const suggBox = document.getElementById('suggestions');
      
      if (!query || query.trim().length < 2) {
        suggBox.style.display = 'none'; 
        return;
      }

      debounceTimer = setTimeout(async () => {
        const url = `${NOMINATIM_URL}?q=${encodeURIComponent(query + ', Córdoba, Argentina')}&format=json&limit=5`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          suggBox.innerHTML = '';
          if (data && data.length > 0) {
            data.forEach(place => {
              const item = document.createElement('div');
              item.className = 'suggestion-item';
              item.textContent = place.display_name;
              item.onclick = () => {
                const latlng = [parseFloat(place.lat), parseFloat(place.lon)];
                
                if (activeInputTarget === 'origin') {
                  userPos = latlng;
                  document.getElementById('originInput').value = place.display_name.split(',')[0];
                  updateUserMarker();
                } else {
                  destPos = latlng;
                  document.getElementById('destInput').value = place.display_name.split(',')[0];
                  if (destMarker) map.removeLayer(destMarker);
                  destMarker = L.marker(destPos, {
                    icon: L.divIcon({ html: '<div style="font-size:28px; filter: drop-shadow(0 0 10px #00f3ff);">🏁</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
                  }).addTo(map);
                }

                suggBox.style.display = 'none';
                map.setView(latlng, 15);
                if (userPos && destPos) recalculateSmartRoute();
              };
              suggBox.appendChild(item);
            });
            suggBox.style.display = 'block';
          }
        } catch (e) {}
      }, 250);
    }

    function clearOrigin() {
      userPos = null;
      document.getElementById('originInput').value = '';
      if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
      clearRoutes();
      showToast('Origen eliminado');
    }

    function clearDestination() {
      destPos = null;
      document.getElementById('destInput').value = '';
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
      clearRoutes();
      showToast('Destino eliminado');
    }

    function clearRoutes() {
      if (routeLayerGroup) map.removeLayer(routeLayerGroup);
      if (detourLayerGroup) map.removeLayer(detourLayerGroup);
      document.getElementById('navPanel').style.display = 'none';
    }

    function toggleMenu(menuId) {
      const target = document.getElementById(menuId);
      const isOpen = target.classList.contains('active');
      closeAllMenus();
      if (!isOpen) target.classList.add('active');
    }

    function closeAllMenus() {
      document.getElementById('hornOptions').classList.remove('active');
      document.getElementById('alertOptions').classList.remove('active');
    }

    function reportIncident(type, label) {
      closeAllMenus();
      const centerPos = map.getCenter();
      const emoji = label.split(' ')[0];
      
      const incidentMarker = L.marker(centerPos, {
        draggable: true,
        icon: L.divIcon({
          html: `<div class="draggable-marker">${emoji}</div>`,
          iconSize: [38, 38], iconAnchor: [19, 19]
        })
      }).addTo(map);

      const incidentObj = { id: Date.now(), pos: [centerPos.lat, centerPos.lng], marker: incidentMarker };
      activeIncidents.push(incidentObj);

      const popupContent = document.createElement('div');
      popupContent.style.textAlign = 'center';
      popupContent.innerHTML = `<div style="font-weight:bold;">${label}</div>`;
      
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'popup-delete-btn';
      deleteBtn.innerHTML = '❌ ELIMINAR';
      deleteBtn.onclick = () => { 
        map.removeLayer(incidentMarker); 
        activeIncidents = activeIncidents.filter(i => i.id !== incidentObj.id);
        recalculateSmartRoute();
      };
      
      popupContent.appendChild(deleteBtn);
      incidentMarker.bindPopup(popupContent);

      incidentMarker.on('dragend', function(event) {
        const newPos = event.target.getLatLng();
        incidentObj.pos = [newPos.lat, newPos.lng];
        recalculateSmartRoute();
      });

      showToast(`¡${label} fijado! Recalculando...`);
      recalculateSmartRoute();
    }

    async function fetchOSRM(points) {
      const coords = points.map(p => `${p[1]},${p[0]}`).join(';');
      const url = `${OSRM_URL}${coords}?overview=full&geometries=geojson&steps=true&alternatives=true`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes.length > 0) {
          return data.routes.map(r => ({
            coords: r.geometry.coordinates.map(c => [c[1], c[0]]),
            distance: r.distance,
            duration: r.duration
          }));
        }
      } catch (e) {}
      return [];
    }

    function calculateRoute() {
      document.getElementById('suggestions').style.display = 'none';
      if (!userPos || !destPos) {
        showToast('⚠️ Definí Origen y Destino primero');
        return;
      }
      recalculateSmartRoute();
    }

    function isRouteSafe(coords) {
      if (activeIncidents.length === 0) return true;
      return coords.every(coord => {
        return activeIncidents.every(incident => {
          return getDistanceMeters(coord, incident.pos) > SAFETY_BUFFER_METERS;
        });
      });
    }

    async function recalculateSmartRoute() {
      if (!userPos || !destPos) return;

      const directRoutes = await fetchOSRM([userPos, destPos]);
      if (directRoutes.length === 0) return;

      currentRoute = directRoutes[0];
      drawRoute(currentRoute.coords, false);
      updateNavInfo(currentRoute);

      if (activeIncidents.length === 0 || isRouteSafe(currentRoute.coords)) {
        if (detourLayerGroup) map.removeLayer(detourLayerGroup);
        document.getElementById('btnDetour').style.display = 'none';
        document.getElementById('btnNextDetour').style.display = 'none';
        availableDetours = [];
        return;
      }

      const offsets = [0.0012, -0.0012, 0.0022, -0.0022];
      let promises = [];

      for (let incident of activeIncidents) {
        const cLat = incident.pos[0];
        const cLng = incident.pos[1];

        for (let latOff of offsets) {
          for (let lngOff of offsets) {
            const bypass = [cLat + latOff, cLng + lngOff];
            if (activeIncidents.every(inc => getDistanceMeters(bypass, inc.pos) > SAFETY_BUFFER_METERS)) {
              promises.push(fetchOSRM([userPos, bypass, destPos]));
            }
          }
        }
      }

      const resultsArray = await Promise.all(promises);
      let validCandidates = [];

      resultsArray.forEach(routes => {
        routes.forEach(tRoute => {
          if (isRouteSafe(tRoute.coords)) {
            if (!validCandidates.some(r => Math.abs(r.distance - tRoute.distance) < 25)) {
              validCandidates.push(tRoute);
            }
          }
        });
      });

      if (validCandidates.length > 0) {
        validCandidates.sort((a, b) => a.distance - b.distance);
        availableDetours = validCandidates;
        currentDetourIndex = 0;

        renderCurrentDetour();
        document.getElementById('btnDetour').style.display = 'block';
        
        if (availableDetours.length > 1) {
          document.getElementById('btnNextDetour').style.display = 'block';
        } else {
          document.getElementById('btnNextDetour').style.display = 'none';
        }

        showToast(`⚡ ${availableDetours.length} atajo(s) calculado(s)`);
      } else {
        if (detourLayerGroup) map.removeLayer(detourLayerGroup);
        document.getElementById('btnDetour').style.display = 'none';
        document.getElementById('btnNextDetour').style.display = 'none';
        availableDetours = [];
        showToast('⚠️ No se hallaron desvíos libres cerca');
      }
    }

    function renderCurrentDetour() {
      if (availableDetours.length === 0) return;
      detourRoute = availableDetours[currentDetourIndex];
      drawRoute(detourRoute.coords, true);
    }

    function cycleNextDetour() {
      if (availableDetours.length <= 1) return;
      currentDetourIndex = (currentDetourIndex + 1) % availableDetours.length;
      renderCurrentDetour();
      showToast(`🔀 Atajo ${currentDetourIndex + 1} de ${availableDetours.length}`);
    }

    function getDistanceMeters(p1, p2) {
      const R = 6371000;
      const dLat = (p2[0] - p1[0]) * Math.PI / 180;
      const dLon = (p2[1] - p1[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(p1[0] * Math.PI / 180) * Math.cos(p2[0] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // DIBUJO DE RUTAS ESTILO TUBOS DE NEÓN CON BRILLO (GLOW)
    function drawRoute(coords, isDetour) {
      if (isDetour && detourLayerGroup) map.removeLayer(detourLayerGroup);
      if (!isDetour && routeLayerGroup) map.removeLayer(routeLayerGroup);

      const group = L.layerGroup();
      const mainColor = isDetour ? '#ff007f' : '#00f3ff';
      const coreColor = isDetour ? '#ffb3d9' : '#ffffff';

      // 1. Línea exterior ancha con opacidad (Efecto Halo/Glow)
      const glowLine = L.polyline(coords, {
        color: mainColor,
        weight: isDetour ? 12 : 14,
        opacity: 0.4,
        lineCap: 'round',
        lineJoin: 'round'
      });

      // 2. Línea interior brillante (Núcleo neón)
      const coreLine = L.polyline(coords, {
        color: coreColor,
        weight: isDetour ? 5 : 6,
        opacity: 1,
        lineCap: 'round',
        lineJoin: 'round'
      });

      group.addLayer(glowLine);
      group.addLayer(coreLine);
      group.addTo(map);

      if (isDetour) detourLayerGroup = group;
      else routeLayerGroup = group;
    }

    function updateNavInfo(routeData) {
      document.getElementById('navPanel').style.display = 'flex';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('navDistance').textContent = `${(routeData.distance / 1000).toFixed(1)} km`;
      document.getElementById('navStreet').textContent = 'RUTA CALCULADA';
    }

    function activateDetour() {
      if (!detourRoute) return;
      drawRoute(detourRoute.coords, false);
      if (detourLayerGroup) map.removeLayer(detourLayerGroup);
      currentRoute = detourRoute;
      document.getElementById('btnDetour').style.display = 'none';
      document.getElementById('btnNextDetour').style.display = 'none';
      showToast('Navegando por el atajo neón');
    }

    function startNavigation() {
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      showToast('Navegación iniciada');
    }

    function stopNavigation() {
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
      showToast('Navegación finalizada');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }
  </script>
</body>
</html>
