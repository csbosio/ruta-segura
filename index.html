<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ruta Segura</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #map {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    .overlay { position: absolute; z-index: 1000; pointer-events: none; }
    .overlay > * { pointer-events: auto; }

    /* Barra Superior */
    .top-bar {
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.7) 70%, transparent 100%);
      display: flex;
      gap: 8px;
    }
    .search-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(30,41,59,0.9);
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-box input::placeholder { color: #94a3b8; }

    /* Menú Desplegable de Sugerencias (Estilo Google Maps) */
    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      margin-top: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 2000;
      display: none;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .suggestion-item {
      padding: 10px 14px;
      font-size: 13px;
      color: #f1f5f9;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .suggestion-item:last-child { border-bottom: none; }
    .suggestion-item:hover, .suggestion-item:active { background: #334155; color: #3b82f6; }
    
    /* Botones */
    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:active { background: #2563eb; transform: scale(0.97); }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-success { background: #22c55e; color: #fff; }

    /* Menú Flotante Estilo Waze */
    .report-wrapper {
      position: absolute;
      right: 16px;
      top: 35%;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      z-index: 1500;
    }
    .fab-main {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #f59e0b;
      color: #000;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(245,158,11,0.5);
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .fab-main:active { transform: scale(0.9); }
    
    .report-menu {
      display: none;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }
    .report-menu.show { display: flex; }

    .fab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15,23,42,0.95);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
    }
    .fab-item:active { transform: scale(0.95); background: rgba(30,41,59,1); }
    .fab-item span { font-size: 18px; }

    /* Estilo de Icono Arrastrable */
    .draggable-marker {
      position: relative;
      font-size: 24px;
      background: rgba(15,23,42,0.9);
      padding: 6px;
      border-radius: 50%;
      border: 2px solid #f59e0b;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      text-align: center;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .draggable-marker:active { cursor: grabbing; transform: scale(1.1); }

    /* Popups de Leaflet */
    .leaflet-popup-content-wrapper {
      background: #0f172a !important;
      color: #fff !important;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px !important;
      padding: 6px !important;
    }
    .leaflet-popup-tip { background: #0f172a !important; }
    .popup-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
      width: 100%;
    }
    .popup-delete-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      margin-top: 4px;
      width: 100%;
    }

    /* Panel Navegación Bottom */
    .nav-panel {
      bottom: 0; left: 0; right: 0;
      padding: 0 16px 20px;
      background: linear-gradient(0deg, rgba(15,23,42,0.98) 0%, rgba(15,23,42,0.85) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .nav-instruction {
      background: rgba(30,41,59,0.95);
      border-radius: 16px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .nav-instruction .street { font-size: 18px; font-weight: 700; color: #fff; }
    .nav-instruction .detail { font-size: 14px; color: #94a3b8; }
    .nav-instruction .distance { font-size: 26px; font-weight: 800; color: #3b82f6; }

    /* Toast */
    .toast {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15,23,42,0.95);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 3000;
      display: none;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Barra Superior -->
  <div class="top-bar overlay">
    <div class="search-box">
      <input type="text" id="originInput" placeholder="📍 Ubicación actual" readonly>
      <input type="text" id="destInput" placeholder="🏁 Escribí o tocá el mapa..." oninput="handleSearchInput(this.value)">
      <div id="suggestions" class="suggestions-list"></div>
    </div>
    <button class="btn btn-primary" onclick="calculateRoute()">🚀 Ir</button>
  </div>

  <!-- Botón Flotante Waze (Reportes) -->
  <div class="report-wrapper overlay">
    <div class="report-menu" id="reportMenu">
      <div class="fab-item" onclick="reportIncident('control', '🚨 Control')">
        <span>🚨</span> Control Policial
      </div>
      <div class="fab-item" onclick="reportIncident('bache', '🕳️ Bache')">
        <span>🕳️</span> Bache
      </div>
      <div class="fab-item" onclick="reportIncident('manifestacion', '🪧 Piquete')">
        <span>🪧</span> Manifestación
      </div>
      <div class="fab-item" onclick="reportIncident('accidente', '💥 Accidente')">
        <span>💥</span> Accidente
      </div>
    </div>
    <button class="fab-main" onclick="toggleReportMenu()">⚠️</button>
  </div>

  <!-- Panel Inferior -->
  <div class="nav-panel overlay" id="navPanel" style="display:none;">
    <div class="nav-instruction">
      <div class="distance" id="navDistance">--</div>
      <div class="street" id="navStreet">Ruta lista</div>
      <div class="detail" id="navDetail">Tocá "Iniciar viaje" para comenzar</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-success" id="btnStart" style="flex:1;" onclick="startNavigation()">▶️ Iniciar viaje</button>
      <button class="btn btn-warning" id="btnDetour" style="display:none; flex:1;" onclick="activateDetour()">🔄 Aplicar Desvío</button>
      <button class="btn btn-danger" id="btnStop" style="display:none; flex:1;" onclick="stopNavigation()">⏹️ Finalizar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';
    const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
    const DEFAULT_ORIGIN = [-31.4201, -64.1888];

    let map, userPos = null, destPos = null, currentRoute = null, detourRoute = null;
    let isNavigating = false, watchId = null;
    let voiceEnabled = true, routeLayer = null, detourLayer = null, userMarker = null, destMarker = null, tempMarker = null;
    let debounceTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      registerSW();
      getUserLocation();
    });

    function registerSW() {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(DEFAULT_ORIGIN, 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      // Evento de toque/clic en el mapa para elegir destino
      map.on('click', function(e) {
        setDestinationFromMap(e.latlng);
      });
    }

    function getUserLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => {
          userPos = [pos.coords.latitude, pos.coords.longitude];
          document.getElementById('originInput').value = '📍 Tu ubicación actual';
          if (!userMarker) {
            userMarker = L.marker(userPos, {
              icon: L.divIcon({
                className: 'user-marker',
                html: '<div style="width:18px;height:18px;background:#3b82f6;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #3b82f6;"></div>',
                iconSize: [18, 18], iconAnchor: [9, 9]
              })
            }).addTo(map);
          } else {
            userMarker.setLatLng(userPos);
          }
          map.setView(userPos, 16);
        },
        () => {
          userPos = DEFAULT_ORIGIN;
          document.getElementById('originInput').value = '📍 Córdoba Centro';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    /* Permite seleccionar destino tocando directamente el mapa */
    async function setDestinationFromMap(latlng) {
      if (tempMarker) map.removeLayer(tempMarker);

      destPos = [latlng.lat, latlng.lng];

      tempMarker = L.marker(destPos, {
        icon: L.divIcon({
          html: '<div style="font-size:26px;">🏁</div>',
          iconSize: [30, 30], iconAnchor: [15, 30]
        })
      }).addTo(map);

      // Popup para confirmar navegación
      const popupDiv = document.createElement('div');
      popupDiv.style.textAlign = 'center';
      popupDiv.innerHTML = '<div style="font-weight:bold;">📍 Destino seleccionado</div>';
      
      const goBtn = document.createElement('button');
      goBtn.className = 'popup-btn';
      goBtn.innerHTML = '🚀 Trazar Ruta';
      goBtn.onclick = () => {
        map.closePopup();
        calculateRoute();
      };
      
      popupDiv.appendChild(goBtn);
      tempMarker.bindPopup(popupDiv).openPopup();

      // Reverse Geocoding simple para actualizar el texto en la barra superior
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) {
          const shortName = data.display_name.split(',')[0];
          document.getElementById('destInput').value = shortName;
        } else {
          document.getElementById('destInput').value = 'Punto en el mapa';
        }
      } catch(e) {
        document.getElementById('destInput').value = 'Punto en el mapa';
      }
    }

    /* Autocompletado escrito */
    function handleSearchInput(query) {
      clearTimeout(debounceTimer);
      const suggBox = document.getElementById('suggestions');
      
      if (query.trim().length < 3) {
        suggBox.style.display = 'none';
        return;
      }

      debounceTimer = setTimeout(async () => {
        const url = `${NOMINATIM_URL}?q=${encodeURIComponent(query + ', Córdoba, Argentina')}&format=json&limit=5`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          suggBox.innerHTML = '';
          if (data && data.length > 0) {
            data.forEach(place => {
              const item = document.createElement('div');
              item.className = 'suggestion-item';
              item.textContent = place.display_name;
              item.onclick = () => {
                document.getElementById('destInput').value = place.display_name.split(',')[0];
                destPos = [parseFloat(place.lat), parseFloat(place.lon)];
                suggBox.style.display = 'none';
                calculateRoute();
              };
              suggBox.appendChild(item);
            });
            suggBox.style.display = 'block';
          } else {
            suggBox.style.display = 'none';
          }
        } catch (e) {
          suggBox.style.display = 'none';
        }
      }, 300);
    }

    function toggleReportMenu() {
      const menu = document.getElementById('reportMenu');
      menu.classList.toggle('show');
    }

    function reportIncident(type, label) {
      toggleReportMenu();
      const centerPos = map.getCenter();
      const emoji = label.split(' ')[0];
      
      const incidentMarker = L.marker(centerPos, {
        draggable: true,
        icon: L.divIcon({
          className: 'custom-incident-icon',
          html: `<div class="draggable-marker">${emoji}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        })
      }).addTo(map);

      const popupContent = document.createElement('div');
      popupContent.style.textAlign = 'center';
      popupContent.innerHTML = `
        <div style="font-weight:bold; margin-bottom: 6px;">${label}</div>
        <div style="font-size:11px; color:#94a3b8; margin-bottom:6px;">Podés arrastrar este ícono en el mapa.</div>
      `;
      
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'popup-delete-btn';
      deleteBtn.innerHTML = '❌ Eliminar alerta';
      deleteBtn.onclick = () => {
        map.removeLayer(incidentMarker);
        showToast('Alerta eliminada');
      };
      
      popupContent.appendChild(deleteBtn);
      incidentMarker.bindPopup(popupContent);

      incidentMarker.on('dragend', function(event) {
        const newPos = event.target.getLatLng();
        showToast(`Ubicación de ${label} actualizada`);
        if (type === 'control' && currentRoute) {
          calculateSmartDetour([newPos.lat, newPos.lng]);
        }
      });

      showToast(`¡${label} agregado! Arrastralo para reubicarlo.`);
      speak(`${label} reportado. Podés moverlo en el mapa.`);

      if (type === 'control' && currentRoute) {
        calculateSmartDetour([centerPos.lat, centerPos.lng]);
      }
    }

    async function getRoute(points) {
      const coords = points.map(p => `${p[1]},${p[0]}`).join(';');
      const url = `${OSRM_URL}${coords}?overview=full&geometries=geojson&steps=true`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes.length > 0) {
          const route = data.routes[0];
          return {
            coords: route.geometry.coordinates.map(c => [c[1], c[0]]),
            distance: route.distance,
            duration: route.duration
          };
        }
      } catch (e) {}
      return null;
    }

    async function calculateRoute() {
      document.getElementById('suggestions').style.display = 'none';
      const destAddress = document.getElementById('destInput').value.trim();
      
      if (!destAddress && !destPos) { showToast('Escribí o tocá un destino en el mapa'); return; }
      if (!userPos) { showToast('Obteniendo tu ubicación GPS...'); return; }

      if (!destPos) {
        showToast('Buscando dirección...');
        const url = `${NOMINATIM_URL}?q=${encodeURIComponent(destAddress + ', Córdoba, Argentina')}&format=json&limit=1`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.length > 0) destPos = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        } catch (e) {}
      }
      
      if (!destPos) { showToast('No se encontró la dirección'); return; }

      if (destMarker) map.removeLayer(destMarker);
      if (tempMarker) map.removeLayer(tempMarker);

      destMarker = L.marker(destPos, {
        icon: L.divIcon({
          html: '<div style="font-size:26px;">🏁</div>',
          iconSize: [30, 30], iconAnchor: [15, 30]
        })
      }).addTo(map);

      currentRoute = await getRoute([userPos, destPos]);
      if (!currentRoute) { showToast('Error al trazar ruta'); return; }

      drawRoute(currentRoute.coords, '#3b82f6', false);

      document.getElementById('navPanel').style.display = 'flex';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnDetour').style.display = 'none';
      document.getElementById('btnStop').style.display = 'none';

      document.getElementById('navDistance').textContent = `${(currentRoute.distance / 1000).toFixed(1)} km`;
      document.getElementById('navStreet').textContent = 'Ruta calculada';
      document.getElementById('navDetail').textContent = `Tiempo est.: ${Math.ceil(currentRoute.duration / 60)} min`;

      map.fitBounds([userPos, destPos], { padding: [50, 50] });
    }

    function drawRoute(coords, color, isDetour) {
      if (isDetour && detourLayer) map.removeLayer(detourLayer);
      if (!isDetour && routeLayer) map.removeLayer(routeLayer);

      const layer = L.polyline(coords, {
        color: color, weight: isDetour ? 5 : 7, opacity: 0.85
      }).addTo(map);

      if (isDetour) detourLayer = layer;
      else routeLayer = layer;
    }

    async function calculateSmartDetour(controlPos) {
      if (!userPos || !destPos) return;
      const perpPoint = [controlPos[0] + 0.003, controlPos[1] - 0.003];
      detourRoute = await getRoute([userPos, perpPoint, destPos]);

      if (detourRoute) {
        drawRoute(detourRoute.coords, '#f59e0b', true);
        document.getElementById('btnDetour').style.display = 'block';
        showToast('🔄 ¡Desvío alternativo listo!');
        speak('Control detectado. Podés activar el desvío sugerido.');
      }
    }

    function activateDetour() {
      if (!detourRoute) return;
      drawRoute(detourRoute.coords, '#3b82f6', false);
      if (detourLayer) map.removeLayer(detourLayer);
      currentRoute = detourRoute;
      document.getElementById('btnDetour').style.display = 'none';
      showToast('Desvío activado');
      speak('Ruta actualizada por desvío.');
    }

    function startNavigation() {
      isNavigating = true;
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';

      if (navigator.geolocation) {
        watchId = navigator.geolocation.watchPosition(
          pos => {
            userPos = [pos.coords.latitude, pos.coords.longitude];
            if (userMarker) userMarker.setLatLng(userPos);
            map.setView(userPos, 18);
          },
          () => {},
          { enableHighAccuracy: true }
        );
      }
      showToast('Navegación iniciada');
      speak('Navegación iniciada. Buen viaje.');
    }

    function stopNavigation() {
      isNavigating = false;
      if (watchId) navigator.geolocation.clearWatch(watchId);
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
      showToast('Navegación finalizada');
    }

    function speak(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-AR';
      window.speechSynthesis.speak(utterance);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
