<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Ruta Segura v8 - Multi-Obstáculos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .overlay { position: absolute; z-index: 1000; pointer-events: none; }
    .overlay > * { pointer-events: auto; }

    /* Barra Superior */
    .top-bar {
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.7) 70%, transparent 100%);
      display: flex; gap: 8px; align-items: flex-start;
    }
    .search-box { flex: 1; display: flex; flex-direction: column; gap: 8px; position: relative; }
    
    .input-row {
      display: flex; align-items: center; background: rgba(30,41,59,0.95);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 12px; padding: 2px 8px;
    }
    .input-row:focus-within { border-color: #3b82f6; }
    
    .input-row input {
      flex: 1; padding: 10px 6px; border: none; background: transparent;
      color: #fff; font-size: 14px; outline: none; width: 100%;
    }
    
    .icon-btn {
      background: none; border: none; color: #94a3b8; font-size: 15px;
      cursor: pointer; padding: 6px; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { color: #fff; transform: scale(1.1); }

    .suggestions-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #1e293b; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px; margin-top: 4px; max-height: 220px; overflow-y: auto;
      z-index: 9999 !important; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .suggestion-item {
      padding: 12px 14px; font-size: 13px; color: #f1f5f9; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .suggestion-item:hover { background: #334155; color: #3b82f6; }
    
    .action-btns { display: flex; align-self: center; }
    .btn {
      padding: 12px 16px; border-radius: 12px; border: none; font-size: 15px;
      font-weight: 700; cursor: pointer; white-space: nowrap; display: flex;
      align-items: center; justify-content: center; height: 100%;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-success { background: #22c55e; color: #fff; }

    /* CONTENEDOR DE BURBUJAS DERECHA */
    .floating-controls {
      position: absolute; right: 16px; top: 22%;
      display: flex; flex-direction: column; gap: 14px;
      align-items: flex-end; z-index: 1500;
    }

    .bubble-group { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    .fab-btn {
      width: 52px; height: 52px; border-radius: 50%; font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .fab-gps { background: #10b981; color: #fff; }
    .fab-horn { background: #2563eb; color: #fff; }
    .fab-alert { background: #f59e0b; color: #000; }

    .menu-options {
      display: none; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .menu-options.active { display: flex; }

    .menu-item {
      display: flex; align-items: center; gap: 8px;
      background: rgba(15,23,42,0.95); padding: 8px 14px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .menu-item:active { background: #334155; }

    .draggable-marker {
      font-size: 24px; background: rgba(15,23,42,0.9); padding: 6px;
      border-radius: 50%; border: 2px solid #f59e0b; text-align: center; cursor: grab;
    }

    /* Popups */
    .leaflet-popup-content-wrapper { background: #0f172a !important; color: #fff !important; border-radius: 12px !important; }
    .popup-delete-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; width: 100%; margin-top: 4px; cursor: pointer; }

    /* Panel Inferior */
    .nav-panel {
      bottom: 0; left: 0; right: 0; padding: 0 16px 20px;
      background: linear-gradient(0deg, rgba(15,23,42,0.98) 0%, rgba(15,23,42,0.85) 60%, transparent 100%);
      display: flex; flex-direction: column; gap: 10px;
    }
    .nav-instruction { background: rgba(30,41,59,0.95); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); }
    .nav-instruction .street { font-size: 18px; font-weight: 700; color: #fff; }
    .nav-instruction .distance { font-size: 26px; font-weight: 800; color: #3b82f6; }

    .toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15,23,42,0.95); color: #fff; padding: 12px 20px;
      border-radius: 12px; font-size: 14px; z-index: 3000; display: none;
      border: 1px solid rgba(255,255,255,0.2); text-align: center;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Barra Superior -->
  <div class="top-bar overlay">
    <div class="search-box">
      <!-- Fila 1: Origen -->
      <div class="input-row">
        <button class="icon-btn" onclick="getUserLocation()" title="Usar GPS actual">📍</button>
        <input type="text" id="originInput" placeholder="Origen: escribí o tocá el mapa..." oninput="handleSearchInput(this.value, 'origin')">
        <button class="icon-btn" onclick="clearOrigin()" title="Borrar Origen">❌</button>
      </div>
      
      <!-- Fila 2: Destino -->
      <div class="input-row">
        <span style="font-size:14px; padding:0 6px;">🏁</span>
        <input type="text" id="destInput" placeholder="Destino: escribí o tocá el mapa..." oninput="handleSearchInput(this.value, 'dest')">
        <button class="icon-btn" onclick="clearDestination()" title="Borrar Destino">❌</button>
      </div>

      <div id="suggestions" class="suggestions-list"></div>
    </div>

    <div class="action-btns">
      <button class="btn btn-primary" onclick="calculateRoute()">🚀 Ir</button>
    </div>
  </div>

  <!-- BURBUJAS FLOTANTES DERECHA -->
  <div class="floating-controls overlay">
    <button class="fab-btn fab-gps" onclick="enableSetOriginMode()" title="Marcar punto de origen en el mapa">🚗</button>

    <!-- Burbuja 1: Bocina (Controles e Inspecciones) -->
    <div class="bubble-group">
      <div class="menu-options" id="hornOptions">
        <div class="menu-item" onclick="reportIncident('control_municipal', '🏛️ Control Municipal')"><span>🏛️</span> Control Municipal</div>
        <div class="menu-item" onclick="reportIncident('itv', '🔍 ITV')"><span>🔍</span> ITV</div>
        <div class="menu-item" onclick="reportIncident('radar', '📷 Radar')"><span>📷</span> Radar</div>
        <div class="menu-item" onclick="reportIncident('control_transito', '🚘 Control de Tránsito')"><span>🚘</span> Control de Tránsito</div>
        <div class="menu-item" onclick="reportIncident('control_transporte', '🚌 Control Transporte')"><span>🚌</span> Control Transporte</div>
        <div class="menu-item" onclick="reportIncident('control_policial', '🚨 Control Policial')"><span>🚨</span> Control Policial</div>
      </div>
      <button class="fab-btn fab-horn" onclick="toggleMenu('hornOptions')">📢</button>
    </div>

    <!-- Burbuja 2: Alerta Triangular (Imprevistos Viales) -->
    <div class="bubble-group">
      <div class="menu-options" id="alertOptions">
        <div class="menu-item" onclick="reportIncident('bache', '🕳️ Bache')"><span>🕳️</span> Bache</div>
        <div class="menu-item" onclick="reportIncident('manifestacion', '🪧 Manifestación')"><span>🪧</span> Manifestación</div>
        <div class="menu-item" onclick="reportIncident('corte', '🚧 Corte de Calle')"><span>🚧</span> Corte de Calle</div>
      </div>
      <button class="fab-btn fab-alert" onclick="toggleMenu('alertOptions')">⚠️</button>
    </div>
  </div>

  <!-- Panel Navegación Inferior -->
  <div class="nav-panel overlay" id="navPanel" style="display:none;">
    <div class="nav-instruction">
      <div class="distance" id="navDistance">--</div>
      <div class="street" id="navStreet">Ruta Lista</div>
      <div class="detail" id="navDetail" style="color:#94a3b8; font-size:14px;">Tocá "Iniciar viaje" para comenzar</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-success" id="btnStart" style="flex:1;" onclick="startNavigation()">▶️ Iniciar viaje</button>
      <button class="btn btn-warning" id="btnDetour" style="display:none; flex:1;" onclick="activateDetour()">🔄 Aplicar Desvío Seguro</button>
      <button class="btn btn-danger" id="btnStop" style="display:none; flex:1;" onclick="stopNavigation()">⏹️ Finalizar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';
    const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
    const DEFAULT_ORIGIN = [-31.4201, -64.1888];

    let map, userPos = null, destPos = null;
    let currentRoute = null, detourRoute = null;
    let routeLayer = null, detourLayer = null;
    let userMarker = null, destMarker = null;
    let activeIncidents = [];
    let debounceTimer = null;
    let settingOriginMode = false;
    let activeInputTarget = 'dest';

    const SAFETY_BUFFER_METERS = 150; // Distancia mínima respetada frente a cualquier alerta

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      getUserLocation();
    });

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(DEFAULT_ORIGIN, 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      map.on('click', function(e) {
        document.getElementById('suggestions').style.display = 'none';
        closeAllMenus();
        
        if (settingOriginMode) {
          setOriginFromMap(e.latlng);
          settingOriginMode = false;
        } else {
          setDestinationFromMap(e.latlng);
        }
      });
    }

    function getUserLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => {
          userPos = [pos.coords.latitude, pos.coords.longitude];
          document.getElementById('originInput').value = 'Mi ubicación actual';
          updateUserMarker();
          map.setView(userPos, 15);
          showToast('📍 Ubicación detectada');
        },
        () => {
          userPos = DEFAULT_ORIGIN;
          document.getElementById('originInput').value = 'Córdoba Centro';
          updateUserMarker();
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function updateUserMarker() {
      if (!userPos) return;
      if (!userMarker) {
        userMarker = L.marker(userPos, {
          icon: L.divIcon({
            html: '<div style="width:20px;height:20px;background:#3b82f6;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #3b82f6;"></div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
          })
        }).addTo(map);
      } else {
        userMarker.setLatLng(userPos);
      }
    }

    function enableSetOriginMode() {
      settingOriginMode = true;
      showToast('👉 Tocá en el mapa para fijar tu ORIGEN (🚗)');
    }

    async function setOriginFromMap(latlng) {
      userPos = [latlng.lat, latlng.lng];
      updateUserMarker();
      
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) {
          document.getElementById('originInput').value = data.display_name.split(',')[0];
        }
      } catch(e){}

      if (destPos) recalculateSmartRoute();
    }

    async function setDestinationFromMap(latlng) {
      destPos = [latlng.lat, latlng.lng];

      if (destMarker) map.removeLayer(destMarker);
      destMarker = L.marker(destPos, {
        icon: L.divIcon({ html: '<div style="font-size:26px;">🏁</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
      }).addTo(map);

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) {
          document.getElementById('destInput').value = data.display_name.split(',')[0];
        }
      } catch(e){}

      if (userPos) recalculateSmartRoute();
    }

    function handleSearchInput(query, target) {
      activeInputTarget = target;
      clearTimeout(debounceTimer);
      const suggBox = document.getElementById('suggestions');
      
      if (!query || query.trim().length < 2) {
        suggBox.style.display = 'none'; 
        return;
      }

      debounceTimer = setTimeout(async () => {
        const url = `${NOMINATIM_URL}?q=${encodeURIComponent(query + ', Córdoba, Argentina')}&format=json&limit=5`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          suggBox.innerHTML = '';
          if (data && data.length > 0) {
            data.forEach(place => {
              const item = document.createElement('div');
              item.className = 'suggestion-item';
              item.textContent = place.display_name;
              item.onclick = () => {
                const latlng = [parseFloat(place.lat), parseFloat(place.lon)];
                
                if (activeInputTarget === 'origin') {
                  userPos = latlng;
                  document.getElementById('originInput').value = place.display_name.split(',')[0];
                  updateUserMarker();
                } else {
                  destPos = latlng;
                  document.getElementById('destInput').value = place.display_name.split(',')[0];
                  if (destMarker) map.removeLayer(destMarker);
                  destMarker = L.marker(destPos, {
                    icon: L.divIcon({ html: '<div style="font-size:26px;">🏁</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
                  }).addTo(map);
                }

                suggBox.style.display = 'none';
                map.setView(latlng, 15);
                if (userPos && destPos) recalculateSmartRoute();
              };
              suggBox.appendChild(item);
            });
            suggBox.style.display = 'block';
          }
        } catch (e) {}
      }, 250);
    }

    function clearOrigin() {
      userPos = null;
      document.getElementById('originInput').value = '';
      if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
      clearRoutes();
      showToast('Origen eliminado');
    }

    function clearDestination() {
      destPos = null;
      document.getElementById('destInput').value = '';
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
      clearRoutes();
      showToast('Destino eliminado');
    }

    function clearRoutes() {
      if (routeLayer) map.removeLayer(routeLayer);
      if (detourLayer) map.removeLayer(detourLayer);
      document.getElementById('navPanel').style.display = 'none';
    }

    function toggleMenu(menuId) {
      const target = document.getElementById(menuId);
      const isOpen = target.classList.contains('active');
      closeAllMenus();
      if (!isOpen) target.classList.add('active');
    }

    function closeAllMenus() {
      document.getElementById('hornOptions').classList.remove('active');
      document.getElementById('alertOptions').classList.remove('active');
    }

    function reportIncident(type, label) {
      closeAllMenus();
      const centerPos = map.getCenter();
      const emoji = label.split(' ')[0];
      
      const incidentMarker = L.marker(centerPos, {
        draggable: true,
        icon: L.divIcon({
          html: `<div class="draggable-marker">${emoji}</div>`,
          iconSize: [36, 36], iconAnchor: [18, 18]
        })
      }).addTo(map);

      const incidentObj = { id: Date.now(), pos: [centerPos.lat, centerPos.lng], marker: incidentMarker };
      activeIncidents.push(incidentObj);

      const popupContent = document.createElement('div');
      popupContent.style.textAlign = 'center';
      popupContent.innerHTML = `<div style="font-weight:bold;">${label}</div>`;
      
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'popup-delete-btn';
      deleteBtn.innerHTML = '❌ Eliminar';
      deleteBtn.onclick = () => { 
        map.removeLayer(incidentMarker); 
        activeIncidents = activeIncidents.filter(i => i.id !== incidentObj.id);
        recalculateSmartRoute();
      };
      
      popupContent.appendChild(deleteBtn);
      incidentMarker.bindPopup(popupContent);

      incidentMarker.on('dragend', function(event) {
        const newPos = event.target.getLatLng();
        incidentObj.pos = [newPos.lat, newPos.lng];
        recalculateSmartRoute();
      });

      showToast(`¡${label} agregado! Buscando desvíos...`);
      recalculateSmartRoute();
    }

    async function fetchOSRM(points) {
      const coords = points.map(p => `${p[1]},${p[0]}`).join(';');
      const url = `${OSRM_URL}${coords}?overview=full&geometries=geojson&steps=true&alternatives=true`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes.length > 0) {
          return data.routes.map(r => ({
            coords: r.geometry.coordinates.map(c => [c[1], c[0]]),
            distance: r.distance,
            duration: r.duration
          }));
        }
      } catch (e) {}
      return [];
    }

    function calculateRoute() {
      document.getElementById('suggestions').style.display = 'none';
      if (!userPos || !destPos) {
        showToast('⚠️ Definí Origen y Destino primero');
        return;
      }
      recalculateSmartRoute();
    }

    // Comprueba si una traza es 100% segura frente a TODOS los obstáculos cargados
    function isRouteSafe(coords) {
      if (activeIncidents.length === 0) return true;
      return coords.every(coord => {
        return activeIncidents.every(incident => {
          return getDistanceMeters(coord, incident.pos) > SAFETY_BUFFER_METERS;
        });
      });
    }

    async function recalculateSmartRoute() {
      if (!userPos || !destPos) return;

      const directRoutes = await fetchOSRM([userPos, destPos]);
      if (directRoutes.length === 0) return;

      currentRoute = directRoutes[0];
      drawRoute(currentRoute.coords, '#3b82f6', false);
      updateNavInfo(currentRoute);

      // Si no hay incidentes o la ruta original está completamente libre
      if (activeIncidents.length === 0 || isRouteSafe(currentRoute.coords)) {
        if (detourLayer) map.removeLayer(detourLayer);
        document.getElementById('btnDetour').style.display = 'none';
        return;
      }

      // Si la ruta pasa cerca de AL MENOS UN obstáculo, calculamos desvíos
      let bestDetour = null;
      let minDistance = Infinity;

      // Creamos waypoints de desvío con distancias progresivas (300m y 500m)
      const offsets = [0.003, -0.003, 0.005, -0.005];

      for (let incident of activeIncidents) {
        const cLat = incident.pos[0];
        const cLng = incident.pos[1];

        let bypassCandidates = [];
        for (let latOff of offsets) {
          for (let lngOff of offsets) {
            bypassCandidates.push([cLat + latOff, cLng + lngOff]);
          }
        }

        // Probamos rutas compuestas que esquiven la zona afectada
        for (let bypass of bypassCandidates) {
          const testRoutes = await fetchOSRM([userPos, bypass, destPos]);
          for (let tRoute of testRoutes) {
            // Validación MULTI-OBSTÁCULO: la ruta no puede tocar NINGÚN incidente
            if (isRouteSafe(tRoute.coords) && tRoute.distance < minDistance) {
              minDistance = tRoute.distance;
              bestDetour = tRoute;
            }
          }
        }
      }

      if (bestDetour) {
        detourRoute = bestDetour;
        drawRoute(detourRoute.coords, '#f59e0b', true);
        document.getElementById('btnDetour').style.display = 'block';
        showToast('⚡ Atajo seguro disponible (esquivando todos los cortes)');
      } else {
        if (detourLayer) map.removeLayer(detourLayer);
        document.getElementById('btnDetour').style.display = 'none';
        showToast('⚠️ Zona bloqueada: No se encontró ruta alternativa segura');
      }
    }

    function getDistanceMeters(p1, p2) {
      const R = 6371000;
      const dLat = (p2[0] - p1[0]) * Math.PI / 180;
      const dLon = (p2[1] - p1[1]) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(p1[0] * Math.PI / 180) * Math.cos(p2[0] * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function drawRoute(coords, color, isDetour) {
      if (isDetour && detourLayer) map.removeLayer(detourLayer);
      if (!isDetour && routeLayer) map.removeLayer(routeLayer);

      const layer = L.polyline(coords, { color: color, weight: isDetour ? 6 : 7, opacity: 0.9 }).addTo(map);

      if (isDetour) detourLayer = layer;
      else routeLayer = layer;
    }

    function updateNavInfo(routeData) {
      document.getElementById('navPanel').style.display = 'flex';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('navDistance').textContent = `${(routeData.distance / 1000).toFixed(1)} km`;
      document.getElementById('navStreet').textContent = 'Ruta Lista';
    }

    function activateDetour() {
      if (!detourRoute) return;
      drawRoute(detourRoute.coords, '#3b82f6', false);
      if (detourLayer) map.removeLayer(detourLayer);
      currentRoute = detourRoute;
      document.getElementById('btnDetour').style.display = 'none';
      showToast('Navegando por el atajo seguro');
    }

    function startNavigation() {
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      showToast('Navegación iniciada');
    }

    function stopNavigation() {
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
      showToast('Navegación finalizada');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }
  </script>
</body>
</html>
