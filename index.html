<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Movilidad y Alertas</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: sans-serif;
            background: #ffffff;
            transition: background 0.3s;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .ui-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            gap: 5px;
        }
        .ui-controls button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .report-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: #e74c3c;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ui-controls">
        <button onclick="setTheme('light')">☀️ Claro</button>
        <button onclick="setTheme('dark')">🌙 Oscuro</button>
        <button onclick="setTheme('pacman')">🟡 Pacman</button>
    </div>

    <button class="report-btn" onclick="openReportModal()">📢 Reportar Alerta</button>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Firebase App (compat) y Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // CONFIGURA TU FIREBASE AQUÍ
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Inicializar Mapa centrado en Córdoba, Argentina
        const map = L.map('map').setView([-31.4201, -64.1888], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Tipos de reportes
        const REPORT_TYPES = {
            caminera: { label: 'Control de Caminera', icon: '🚓', color: '#2980b9' },
            municipal: { label: 'Control Municipal', icon: '🏛️', color: '#f39c12' },
            itv: { label: 'Control ITV', icon: '🔧', color: '#3498db' },
            radar: { label: 'Radar / Fotomulta', icon: '📷', color: '#e74c3c' },
            bache: { label: 'Bache / Peligro', icon: '⚠️', color: '#9b59b6' }
        };

        const markersLayer = L.layerGroup().addTo(map);
        const markersMap = {}; 

        // Escuchar reportes nuevos en tiempo real (sin redondeles, solo el icono directo)
        database.ref('incidents').on('child_added', (snapshot) => {
            const id = snapshot.key;
            const data = snapshot.val();
            if (!data) return;

            const config = REPORT_TYPES[data.type] || { label: 'Alerta', icon: '⚠️', color: '#333' };
            
            let iconHtml = `<div style="font-size:24px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); text-align:center;">${config.icon}</div>`;
            
            if (window.isPacmanMode) {
                iconHtml = `<div style="font-size:24px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4)); text-align:center;">👻</div>`;
            }

            const customIcon = L.divIcon({
                className: 'custom-marker',
                html: iconHtml,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            const marker = L.marker([data.lat, data.lng], { icon: customIcon }).addTo(markersLayer);
            
            marker.bindPopup(`
                <div style="text-align:center; font-family:sans-serif;">
                    <b style="font-size: 14px;">${config.label}</b><br>
                    <p style="margin: 5px 0; font-size: 12px;">${data.description || 'Reportado por la comunidad'}</p>
                    <button onclick="window.deleteReportGlobal('${id}')" style="background:#e74c3c; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-top:5px;">🗑️ Borrar alerta</button>
                </div>
            `);

            markersMap[id] = marker;
        });

        // Escuchar cuando alguien borra un reporte
        database.ref('incidents').on('child_removed', (snapshot) => {
            const id = snapshot.key;
            if (markersMap[id]) {
                markersLayer.removeLayer(markersMap[id]);
                delete markersMap[id];
            }
        });

        // Función global para eliminar el nodo de Firebase
        window.deleteReportGlobal = function(id) {
            if (confirm("¿Estás segura de que querés eliminar este reporte para todos?")) {
                database.ref('incidents/' + id).remove().catch((error) => {
                    console.error("Error al eliminar:", error);
                });
            }
        };

        // Función para enviar un nuevo reporte a Firebase
        function sendReport(type, lat, lng, description) {
            database.ref('incidents').push({
                type: type,
                lat: lat,
                lng: lng,
                description: description || '',
                timestamp: Date.now()
            });
        }

        // Modo PACMAN y Temas Visuales
        let userMarker = null;
        window.isPacmanMode = false;

        function setTheme(mode) {
            const mapContainer = document.getElementById('map');
            window.isPacmanMode = false;

            if (mode === 'light') {
                mapContainer.style.filter = 'none';
                document.body.style.background = '#ffffff';
            } 
            else if (mode === 'dark') {
                mapContainer.style.filter = 'invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%)';
                document.body.style.background = '#121212';
            } 
            else if (mode === 'pacman') {
                window.isPacmanMode = true;
                mapContainer.style.filter = 'invert(100%) hue-rotate(200deg) brightness(85%) contrast(120%) saturate(150%)';
                document.body.style.background = '#000022';
            }
            
            updateUserAvatar();
            
            // Recargar marcadores para aplicar cambio instantáneo de fantasmitas / iconos
            location.reload(); 
        }

        function updateUserAvatar(lat, lng) {
            let avatarHtml = '';
            
            if (window.isPacmanMode) {
                avatarHtml = `<div style="font-size: 26px; transform: rotate(0deg); filter: drop-shadow(0 0 5px yellow);">ᗧ</div>`;
            } else {
                avatarHtml = `<div style="background:#2ecc71; border:3px solid white; width:20px; height:20px; border-radius:50%; box-shadow:0 0 10px rgba(0,0,0,0.5);"></div>`;
            }

            const pacmanIcon = L.divIcon({
                className: 'user-avatar-icon',
                html: avatarHtml,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            const center = map.getCenter();
            const currentLat = lat || center.lat;
            const currentLng = lng || center.lng;

            if (!userMarker) {
                userMarker = L.marker([currentLat, currentLng], { icon: pacmanIcon }).addTo(map);
            } else {
                userMarker.setIcon(pacmanIcon);
                userMarker.setLatLng([currentLat, currentLng]);
            }
        }

        function openReportModal() {
            const typeKeys = Object.keys(REPORT_TYPES);
            const randomType = typeKeys[Math.floor(Math.random() * typeKeys.length)];
            const center = map.getCenter();
            const lat = center.lat + (Math.random() - 0.5) * 0.01;
            const lng = center.lng + (Math.random() - 0.5) * 0.01;
            
            sendReport(randomType, lat, lng, "Reportado desde la App");
            alert("¡Alerta enviada con éxito en tiempo real!");
        }

        updateUserAvatar();
    </script>
</body>
</html>
