<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Ruta Segura v2</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .overlay { position: absolute; z-index: 1000; pointer-events: none; }
    .overlay > * { pointer-events: auto; }

    /* Barra Superior */
    .top-bar {
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(180deg, rgba(15,23,42,0.95) 0%, rgba(15,23,42,0.7) 70%, transparent 100%);
      display: flex; gap: 8px; align-items: flex-start;
    }
    .search-box { flex: 1; display: flex; flex-direction: column; gap: 6px; position: relative; }
    .search-box input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(30,41,59,0.95);
      color: #fff; font-size: 14px; outline: none;
    }

    .suggestions-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: #1e293b; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px; margin-top: 4px; max-height: 220px; overflow-y: auto;
      z-index: 9999 !important; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .suggestion-item {
      padding: 12px 14px; font-size: 13px; color: #f1f5f9; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .suggestion-item:hover { background: #334155; color: #3b82f6; }
    
    .action-btns { display: flex; gap: 6px; }
    .btn {
      padding: 12px 14px; border-radius: 12px; border: none; font-size: 14px;
      font-weight: 600; cursor: pointer; white-space: nowrap; display: flex;
      align-items: center; justify-content: center;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-warning { background: #f59e0b; color: #000; }
    .btn-success { background: #22c55e; color: #fff; }

    /* CONTENEDOR DE BURBUJAS DERECHA */
    .floating-controls {
      position: absolute; right: 16px; top: 20%;
      display: flex; flex-direction: column; gap: 16px;
      align-items: flex-end; z-index: 1500;
    }

    .bubble-group { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    .fab-btn {
      width: 56px; height: 56px; border-radius: 50%; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .fab-horn { background: #2563eb; color: #fff; }
    .fab-alert { background: #f59e0b; color: #000; }

    .menu-options {
      display: none; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    .menu-options.active { display: flex; }

    .menu-item {
      display: flex; align-items: center; gap: 8px;
      background: rgba(15,23,42,0.95); padding: 8px 14px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 13px;
      font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .menu-item:active { background: #334155; }

    .draggable-marker {
      font-size: 24px; background: rgba(15,23,42,0.9); padding: 6px;
      border-radius: 50%; border: 2px solid #f59e0b; text-align: center; cursor: grab;
    }

    /* Popups */
    .leaflet-popup-content-wrapper { background: #0f172a !important; color: #fff !important; border-radius: 12px !important; }
    .popup-delete-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 8px; width: 100%; margin-top: 4px; cursor: pointer; }

    /* Panel Inferior */
    .nav-panel {
      bottom: 0; left: 0; right: 0; padding: 0 16px 20px;
      background: linear-gradient(0deg, rgba(15,23,42,0.98) 0%, rgba(15,23,42,0.85) 60%, transparent 100%);
      display: flex; flex-direction: column; gap: 10px;
    }
    .nav-instruction { background: rgba(30,41,59,0.95); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.1); }
    .nav-instruction .street { font-size: 18px; font-weight: 700; color: #fff; }
    .nav-instruction .distance { font-size: 26px; font-weight: 800; color: #3b82f6; }

    .toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15,23,42,0.95); color: #fff; padding: 12px 20px;
      border-radius: 12px; font-size: 14px; z-index: 3000; display: none;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Barra Superior -->
  <div class="top-bar overlay">
    <div class="search-box">
      <input type="text" id="originInput" placeholder="📍 Ubicación actual" readonly>
      <input type="text" id="destInput" placeholder="🏁 Escribí o tocá el mapa..." oninput="handleSearchInput(this.value)">
      <div id="suggestions" class="suggestions-list"></div>
    </div>
    <div class="action-btns">
      <button class="btn btn-primary" onclick="calculateRoute()">🚀 Ir</button>
      <button class="btn btn-danger" onclick="clearDestination()" title="Borrar Destino">❌</button>
    </div>
  </div>

  <!-- BURBUJAS FLOTANTES DERECHA -->
  <div class="floating-controls overlay">
    
    <!-- Burbuja 1: Bocina (Controles e Inspecciones) -->
    <div class="bubble-group">
      <div class="menu-options" id="hornOptions">
        <div class="menu-item" onclick="reportIncident('control_municipal', '🏛️ Control Municipal')"><span>🏛️</span> Control Municipal</div>
        <div class="menu-item" onclick="reportIncident('itv', '🔍 ITV')"><span>🔍</span> ITV</div>
        <div class="menu-item" onclick="reportIncident('radar', '📷 Radar')"><span>📷</span> Radar</div>
        <div class="menu-item" onclick="reportIncident('control_transito', '🚘 Control de Tránsito')"><span>🚘</span> Control de Tránsito</div>
        <div class="menu-item" onclick="reportIncident('control_transporte', '🚌 Control Transporte')"><span>🚌</span> Control Transporte</div>
        <div class="menu-item" onclick="reportIncident('control_policial', '🚨 Control Policial')"><span>🚨</span> Control Policial</div>
      </div>
      <button class="fab-btn fab-horn" onclick="toggleMenu('hornOptions')">📢</button>
    </div>

    <!-- Burbuja 2: Alerta Triangular (Imprevistos Viales) -->
    <div class="bubble-group">
      <div class="menu-options" id="alertOptions">
        <div class="menu-item" onclick="reportIncident('bache', '🕳️ Bache')"><span>🕳️</span> Bache</div>
        <div class="menu-item" onclick="reportIncident('manifestacion', '🪧 Manifestación')"><span>🪧</span> Manifestación</div>
        <div class="menu-item" onclick="reportIncident('corte', '🚧 Corte de Calle')"><span>🚧</span> Corte de Calle</div>
      </div>
      <button class="fab-btn fab-alert" onclick="toggleMenu('alertOptions')">⚠️</button>
    </div>

  </div>

  <!-- Panel Navegación Inferior -->
  <div class="nav-panel overlay" id="navPanel" style="display:none;">
    <div class="nav-instruction">
      <div class="distance" id="navDistance">--</div>
      <div class="street" id="navStreet">Ruta lista</div>
      <div class="detail" id="navDetail" style="color:#94a3b8; font-size:14px;">Tocá "Iniciar viaje" para comenzar</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-success" id="btnStart" style="flex:1;" onclick="startNavigation()">▶️ Iniciar viaje</button>
      <button class="btn btn-warning" id="btnDetour" style="display:none; flex:1;" onclick="activateDetour()">🔄 Aplicar Desvío</button>
      <button class="btn btn-danger" id="btnStop" style="display:none; flex:1;" onclick="stopNavigation()">⏹️ Finalizar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const OSRM_URL = 'https://router.project-osrm.org/route/v1/driving/';
    const NOMINATIM_URL = 'https://nominatim.openstreetmap.org/search';
    const DEFAULT_ORIGIN = [-31.4201, -64.1888];

    let map, userPos = null, destPos = null, currentRoute = null, detourRoute = null;
    let routeLayer = null, detourLayer = null, userMarker = null, destMarker = null, tempMarker = null;
    let debounceTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      getUserLocation();
    });

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView(DEFAULT_ORIGIN, 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

      map.on('click', function(e) {
        document.getElementById('suggestions').style.display = 'none';
        closeAllMenus();
        setDestinationFromMap(e.latlng);
      });
    }

    function getUserLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        pos => {
          userPos = [pos.coords.latitude, pos.coords.longitude];
          document.getElementById('originInput').value = '📍 Tu ubicación actual';
          if (!userMarker) {
            userMarker = L.marker(userPos, {
              icon: L.divIcon({
                html: '<div style="width:18px;height:18px;background:#3b82f6;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #3b82f6;"></div>',
                iconSize: [18, 18], iconAnchor: [9, 9]
              })
            }).addTo(map);
          } else {
            userMarker.setLatLng(userPos);
          }
          map.setView(userPos, 16);
        },
        () => {
          userPos = DEFAULT_ORIGIN;
          document.getElementById('originInput').value = '📍 Córdoba Centro';
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    function clearDestination() {
      destPos = null; currentRoute = null;
      document.getElementById('destInput').value = '';
      document.getElementById('suggestions').style.display = 'none';

      if (destMarker) map.removeLayer(destMarker);
      if (tempMarker) map.removeLayer(tempMarker);
      if (routeLayer) map.removeLayer(routeLayer);
      if (detourLayer) map.removeLayer(detourLayer);

      document.getElementById('navPanel').style.display = 'none';
      showToast('Destino eliminado');
    }

    async function setDestinationFromMap(latlng) {
      if (tempMarker) map.removeLayer(tempMarker);
      destPos = [latlng.lat, latlng.lng];

      tempMarker = L.marker(destPos, {
        icon: L.divIcon({ html: '<div style="font-size:26px;">🏁</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
      }).addTo(map);

      calculateRoute();

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${latlng.lat}&lon=${latlng.lng}&format=json`);
        const data = await res.json();
        if (data && data.display_name) {
          document.getElementById('destInput').value = data.display_name.split(',')[0];
        }
      } catch(e){}
    }

    function handleSearchInput(query) {
      clearTimeout(debounceTimer);
      const suggBox = document.getElementById('suggestions');
      if (!query || query.trim().length < 2) {
        suggBox.style.display = 'none'; return;
      }

      debounceTimer = setTimeout(async () => {
        const url = `${NOMINATIM_URL}?q=${encodeURIComponent(query + ', Córdoba, Argentina')}&format=json&limit=5`;
        try {
          const res = await fetch(url);
          const data = await res.json();
          suggBox.innerHTML = '';
          if (data && data.length > 0) {
            data.forEach(place => {
              const item = document.createElement('div');
              item.className = 'suggestion-item';
              item.textContent = place.display_name;
              item.onclick = () => {
                document.getElementById('destInput').value = place.display_name.split(',')[0];
                destPos = [parseFloat(place.lat), parseFloat(place.lon)];
                suggBox.style.display = 'none';
                calculateRoute();
              };
              suggBox.appendChild(item);
            });
            suggBox.style.display = 'block';
          }
        } catch (e) {}
      }, 250);
    }

    function toggleMenu(menuId) {
      const target = document.getElementById(menuId);
      const isOpen = target.classList.contains('active');
      closeAllMenus();
      if (!isOpen) target.classList.add('active');
    }

    function closeAllMenus() {
      document.getElementById('hornOptions').classList.remove('active');
      document.getElementById('alertOptions').classList.remove('active');
    }

    function reportIncident(type, label) {
      closeAllMenus();
      const centerPos = map.getCenter();
      const emoji = label.split(' ')[0];
      
      const incidentMarker = L.marker(centerPos, {
        draggable: true,
        icon: L.divIcon({
          html: `<div class="draggable-marker">${emoji}</div>`,
          iconSize: [36, 36], iconAnchor: [18, 18]
        })
      }).addTo(map);

      const popupContent = document.createElement('div');
      popupContent.style.textAlign = 'center';
      popupContent.innerHTML = `<div style="font-weight:bold;">${label}</div>`;
      
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'popup-delete-btn';
      deleteBtn.innerHTML = '❌ Eliminar';
      deleteBtn.onclick = () => { map.removeLayer(incidentMarker); };
      
      popupContent.appendChild(deleteBtn);
      incidentMarker.bindPopup(popupContent);

      incidentMarker.on('dragend', function(event) {
        const newPos = event.target.getLatLng();
        if (currentRoute) calculateSmartDetour([newPos.lat, newPos.lng]);
      });

      showToast(`¡${label} marcado!`);

      if (currentRoute) {
        calculateSmartDetour([centerPos.lat, centerPos.lng]);
      }
    }

    async function getRoute(points) {
      const coords = points.map(p => `${p[1]},${p[0]}`).join(';');
      const url = `${OSRM_URL}${coords}?overview=full&geometries=geojson&steps=true`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code === 'Ok' && data.routes.length > 0) {
          const route = data.routes[0];
          return {
            coords: route.geometry.coordinates.map(c => [c[1], c[0]]),
            distance: route.distance,
            duration: route.duration
          };
        }
      } catch (e) {}
      return null;
    }

    async function calculateRoute() {
      document.getElementById('suggestions').style.display = 'none';
      if (!userPos || !destPos) return;

      if (destMarker) map.removeLayer(destMarker);
      if (tempMarker) map.removeLayer(tempMarker);

      destMarker = L.marker(destPos, {
        icon: L.divIcon({ html: '<div style="font-size:26px;">🏁</div>', iconSize: [30, 30], iconAnchor: [15, 30] })
      }).addTo(map);

      currentRoute = await getRoute([userPos, destPos]);
      if (!currentRoute) return;

      drawRoute(currentRoute.coords, '#3b82f6', false);

      document.getElementById('navPanel').style.display = 'flex';
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnDetour').style.display = 'none';

      document.getElementById('navDistance').textContent = `${(currentRoute.distance / 1000).toFixed(1)} km`;
      document.getElementById('navStreet').textContent = 'Ruta calculada';

      map.fitBounds([userPos, destPos], { padding: [50, 50] });
    }

    function drawRoute(coords, color, isDetour) {
      if (isDetour && detourLayer) map.removeLayer(detourLayer);
      if (!isDetour && routeLayer) map.removeLayer(routeLayer);

      const layer = L.polyline(coords, { color: color, weight: isDetour ? 6 : 7, opacity: 0.9 }).addTo(map);

      if (isDetour) detourLayer = layer;
      else routeLayer = layer;
    }

    /* NUEVO ALGORITMO: DESVÍO PREVIO AL CONTROL */
    async function calculateSmartDetour(controlPos) {
      if (!userPos || !destPos) return;

      // 1. Calculamos el punto MEDIO entre el usuario y el control (ANTES de llegar)
      const midLat = (userPos[0] + controlPos[0]) / 2;
      const midLng = (userPos[1] + controlPos[1]) / 2;

      // 2. Proyectamos dos puntos perpendiculares laterales a ese punto medio (desviación de 300 metros aprox)
      const offset = 0.004;
      const wayA = [midLat + offset, midLng - offset];
      const wayB = [midLat - offset, midLng + offset];

      // 3. Forzamos a trazar: Usuario -> Punto Previor Lateral -> Destino
      const optionA = await getRoute([userPos, wayA, destPos]);
      const optionB = await getRoute([userPos, wayB, destPos]);

      detourRoute = (optionA && optionB) 
        ? (optionA.distance < optionB.distance ? optionA : optionB) 
        : (optionA || optionB);

      if (detourRoute) {
        drawRoute(detourRoute.coords, '#f59e0b', true);
        document.getElementById('btnDetour').style.display = 'block';
        showToast('🔄 ¡Desvío antes del control generado!');
      }
    }

    function activateDetour() {
      if (!detourRoute) return;
      drawRoute(detourRoute.coords, '#3b82f6', false);
      if (detourLayer) map.removeLayer(detourLayer);
      currentRoute = detourRoute;
      document.getElementById('btnDetour').style.display = 'none';
      showToast('Navegando por desvío');
    }

    function startNavigation() {
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'block';
      showToast('Navegación iniciada');
    }

    function stopNavigation() {
      document.getElementById('btnStart').style.display = 'block';
      document.getElementById('btnStop').style.display = 'none';
      showToast('Navegación finalizada');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
